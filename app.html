function analyzeAnswer(text, question) {
  const lower = text.toLowerCase();
  const words = text.trim().split(/\s+/).length;
  const hits = question.keywords.filter(k=>lower.includes(k.toLowerCase())).length;
  const ratio = hits/question.keywords.length;
  let tD=0,cD=0,mD=0,nextDiff=question.difficulty,nextQ=null,reasoning="";
  if(words<20){
    tD=-8;cD=-6;mD=-5;nextDiff="Easy";nextQ=question.followUpEasy;
    reasoning="Answer was very brief. Switching to a simpler follow-up to help the candidate build confidence and elaborate.";
  } else if(ratio>0.45&&words>60){
    tD=10;cD=8;mD=7;nextDiff="Hard";nextQ=question.followUpHard;
    reasoning="Strong technical answer with depth and relevant keywords. Increasing difficulty to probe advanced knowledge.";
  } else if(ratio>0.25){
    tD=5;cD=4;mD=4;nextDiff=question.difficulty;nextQ=null;
    reasoning="Solid answer covering key concepts. Maintaining current difficulty. Candidate is performing well.";
  } else {
    tD=-3;cD=-2;mD=0;nextDiff="Easy";nextQ=question.followUpEasy;
    reasoning="Answer missed key technical concepts. Asking a clarifying follow-up before advancing to the next topic.";
  }
  return{tD,cD,mD,nextDiff,nextQ,reasoning};
}

async function authRequest(path,payload){
  const res=await fetch(`http://localhost:3001${path}`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(payload),
  });
  const data=await res.json();
  if(!res.ok||!data.ok)throw new Error(data.error||"Authentication failed");
  if(data.token)localStorage.setItem("roleready_token",data.token);
  return data.user;
}

function DashboardScreen({navigate,onLogout}){
  const [uploaded,setUploaded]=useState(resumeState.uploaded);
  const [uploading,setUploading]=useState(false);
  const [uploadError,setUploadError]=useState("");
  const [parseInfo,setParseInfo]=useState(resumeState.parseInfo);
  const [dragging,setDragging]=useState(false);
  const [fname,setFname]=useState(resumeState.fileName);

  const doUpload=async(file)=>{
    if(!file)return;
    setFname(file.name||"Resume.pdf");
    setUploading(true);
    setUploadError("");
    try{
      const form=new FormData();
      form.append("resume",file);
      const res=await fetch("http://localhost:3001/api/analyze-resume",{method:"POST",body:form});
      const data=await res.json();
      if(!res.ok||!data.ok)throw new Error(data.error||"Resume analysis failed");
      resumeAnalysis=data.analysis;
      if(data.candidate)candidate=data.candidate;
      const nextParseInfo={
        source:data.source,
        textPreview:data.textPreview,
        warning:data.warning,
      };
      resumeState={uploaded:true,fileName:file.name||"Resume.pdf",parseInfo:nextParseInfo};
      generatedReport=null;
      lastInterviewSession=null;
      setParseInfo(nextParseInfo);
      setUploaded(true);
    }catch(err){
      setUploadError(err.message||"Could not analyze resume. Start the backend and try again.");
    }finally{
      setUploading(false);
    }
  };

  return(
    <div style={{minHeight:"100vh",background:"var(--bg)",color:"white",fontFamily:"DM Sans,sans-serif"}}>

            <p style={{color:"var(--text-subtle)",fontSize:14}}>
              {resumeState.uploaded?<>AI inferred <span style={{color:"#10B981",fontWeight:600}}>{resumeAnalysis.bestFitRoles[0]?.role||"your top role"}</span> as your strongest path. The flow adapts from your resume evidence.</>:<>Add your resume to unlock role analysis, job matches, adaptive interviews, and coaching reports.</>}
            </p>
          </div>
          <Btn onClick={()=>navigate("interview")} disabled={!resumeState.uploaded} style={{padding:"11px 24px",fontSize:15}}>Start Interview →</Btn>
        </div>

        {/* Top row */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:16,marginBottom:18}}>
          {/* Resume upload */}

            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:16}}>

            </div>
            {!uploaded?(
              <>
                <div onDragOver={e=>{e.preventDefault();setDragging(true);}} onDragLeave={()=>setDragging(false)}
                  onDrop={e=>{e.preventDefault();setDragging(false);doUpload(e.dataTransfer?.files?.[0]);}}
                  onClick={()=>document.getElementById("rInp").click()}
                  style={{border:`2px dashed ${dragging?"#7C3AED":"var(--border)"}`,borderRadius:12,padding:"22px 16px",textAlign:"center",cursor:"pointer",background:dragging?"rgba(124,58,237,0.05)":"transparent",transition:"all 0.2s",marginBottom:12}}>

async function requestInterviewTurn(payload){
  const res=await fetch("http://localhost:3001/api/interview-turn",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(payload),
  });
  const data=await res.json();
  if(!res.ok||!data.ok)throw new Error(data.error||"Interview agent failed");
  return data.turn;
}

async function requestGeneratedReport(payload){
  const res=await fetch("http://localhost:3001/api/generate-report",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(payload),
  });
  const data=await res.json();
  if(!res.ok||!data.ok)throw new Error(data.error||"Report agent failed");
  return data.report;
}

function InterviewScreen({navigate,onLogout}){
  if(!resumeState.uploaded){
    return <LockedScreen navigate={navigate} onLogout={onLogout} title="Adaptive interview is locked" body="Upload your resume first so the interviewer can ask role-specific questions instead of generic prompts."/>;
  }
  const [phase,setPhase]=useState("ready");
  const [qIdx,setQIdx]=useState(0);
  const [answer,setAnswer]=useState("");
  const [transcript,setTranscript]=useState([]);
  const [scores,setScores]=useState({technical:58,communication:63,confidence:60,engagement:68});
  const [difficulty,setDifficulty]=useState("Medium");
  const [reasoning,setReasoning]=useState("Loaded candidate profile. Preparing adaptive first question based on resume analysis...");
  const [currentQ,setCurrentQ]=useState(interviewQuestions[0].question);
  const [questionCategory,setQuestionCategory]=useState("Resume Calibration");
  const [agentSource,setAgentSource]=useState("local");
  const [coachSignal,setCoachSignal]=useState("Resume-aware calibration");
  const [thinking,setThinking]=useState(false);
  const [reporting,setReporting]=useState(false);
  const [elapsed,setElapsed]=useState(0);
  const [bars,setBars]=useState(Array(14).fill(0).map(()=>Math.random()*10+2));
  const [answered,setAnswered]=useState(0);
  const timerRef=useRef(null);
  const scrollRef=useRef(null);

  useEffect(()=>{
    if(phase==="active"){
      timerRef.current=setInterval(()=>setElapsed(e=>e+1),1000);
      const bInt=setInterval(()=>setBars(Array(14).fill(0).map(()=>Math.random()*10+2)),350);
      return()=>{clearInterval(timerRef.current);clearInterval(bInt);};
    }
    return()=>clearInterval(timerRef.current);
  },[phase]);

  useEffect(()=>{
    if(scrollRef.current){scrollRef.current.scrollTop=scrollRef.current.scrollHeight;}
  },[transcript,thinking]);

  const fmt=s=>`${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
  const targetRole=resumeAnalysis.bestFitRoles?.[0]?.role||"Backend Developer";

  const finishInterview=async()=>{
    const session={
      candidate,
      resumeAnalysis,
      transcript,
      scores,
      targetRole,
      durationSeconds:elapsed,
      answered,
      lastReasoning:reasoning,
    };
    lastInterviewSession=session;
    setReporting(true);
    try{
      generatedReport=await requestGeneratedReport(session);
    }catch(err){
      generatedReport={
        ...feedbackReport,
        source:"local-report-fallback",
        warning:err.message,
        coachingSummary:`${candidate.name} completed an adaptive interview for ${targetRole}. Report generation fell back locally, but the transcript and scores were still captured for review.`,
      };
    }finally{
      setReporting(false);
      setPhase("ended");
    }
  };

  const startInterview=async()=>{
    setPhase("active");
    setThinking(true);
    setTranscript([]);
    try{
      const turn=await requestInterviewTurn({
        resumeAnalysis,
        targetRole,
        difficulty:"Medium",
        answer:"",
        currentQuestion:"",
        transcript:[],
        answered:0,
      });
      setCurrentQ(turn.nextQuestion);
      setDifficulty(turn.difficulty||"Medium");
      setReasoning(turn.reasoning);
      setQuestionCategory(turn.category||"Resume Deep-dive");
      setAgentSource(turn.source||"agent");
      setCoachSignal(turn.coachSignal||"Interview calibrated from resume");
      setTranscript([{role:"ai",text:turn.nextQuestion}]);
    }catch(err){
      const first=`Your resume is strongest for ${targetRole}. Walk me through your most relevant project and explain the architecture, tradeoffs, and impact.`;
      setCurrentQ(first);
      setReasoning("Backend agent unavailable, so I used the local adaptive interviewer seeded by the resume's top role.");
      setQuestionCategory("Resume Deep-dive");
      setAgentSource("local-fallback");
      setCoachSignal("Local fallback active");
      setTranscript([{role:"ai",text:first}]);
    }finally{
      setThinking(false);
    }
  };

  const submit=async()=>{
    if(!answer.trim()||thinking)return;
    const submitted=answer;
    const previousTranscript=[...transcript,{role:"candidate",text:submitted}];
    setTranscript(previousTranscript);
    setThinking(true);
    setAnswer("");
    setAnswered(a=>a+1);
    try{
      const turn=await requestInterviewTurn({
        resumeAnalysis,
        targetRole,
        difficulty,
        answer:submitted,
        currentQuestion:currentQ,
        transcript:previousTranscript.slice(-8),
        answered:answered+1,
        scores,
      });
      if(turn.scores){
        setScores({
          technical:Math.max(10,Math.min(100,turn.scores.technical??scores.technical)),
          communication:Math.max(10,Math.min(100,turn.scores.communication??scores.communication)),
          confidence:Math.max(10,Math.min(100,turn.scores.confidence??scores.confidence)),
          engagement:Math.max(10,Math.min(100,turn.scores.engagement??scores.engagement)),
        });
      }
      setDifficulty(turn.difficulty||difficulty);
      setReasoning(turn.reasoning||"The agent analyzed the last response and selected the next question based on resume gaps.");
      setQuestionCategory(turn.category||"Adaptive Follow-up");
      setAgentSource(turn.source||"agent");
      setCoachSignal(turn.coachSignal||"Adaptive follow-up selected");
      const nq=answered+1>=5?"Great session. You have completed the adaptive interview. End the interview to generate your coaching report.":turn.nextQuestion;
      setCurrentQ(nq);
      setTranscript(t=>[...t,{role:"ai",text:nq}]);
      setQIdx(i=>Math.min(4,i+1));
    }catch(err){
      const q=interviewQuestions[Math.min(qIdx,interviewQuestions.length-1)];
      const{tD,cD,mD,nextDiff,nextQ,reasoning:r}=analyzeAnswer(submitted,q);
      setScores(s=>({
        technical:Math.max(10,Math.min(100,s.technical+tD)),
        communication:Math.max(10,Math.min(100,s.communication+mD)),
        confidence:Math.max(10,Math.min(100,s.confidence+cD)),
        engagement:Math.max(10,Math.min(100,s.engagement+3)),
      }));
      setDifficulty(nextDiff);
      setReasoning(`Local fallback: ${r}`);
      setQuestionCategory("Fallback Follow-up");
      setAgentSource("local-fallback");
      setCoachSignal("Network fallback active");
      const nq=nextQ||(qIdx<interviewQuestions.length-1?interviewQuestions[qIdx+1].question:"Great session. End the interview to generate your coaching report.");
      setCurrentQ(nq);
      setTranscript(t=>[...t,{role:"ai",text:nq}]);
      if(!nextQ&&qIdx<interviewQuestions.length-1)setQIdx(i=>i+1);
    }finally{
      setThinking(false);
    }
  };

  const ScoreW=({label,val,color,icon})=>(
    <div style={{background:"var(--bg)",borderRadius:12,padding:"13px 14px",border:"1px solid var(--border)"}}>
      <div style={{display:"flex",alignItems:"center",marginBottom:8}}>
        <span style={{fontSize:16}}>{icon}</span>
        <span style={{color,fontWeight:700,fontSize:19,marginLeft:"auto"}}>{val}</span>
      </div>
      <div style={{color:"var(--text-subtle)",fontSize:11,marginBottom:7,fontWeight:500}}>{label}</div>
      <div style={{height:4,background:"var(--border)",borderRadius:2}}>
        <div style={{height:4,width:`${val}%`,background:`linear-gradient(90deg,${color},${color}70)`,borderRadius:2,transition:"width 0.9s ease"}}/>
      </div>
    </div>
  );

  if(phase==="ready")return(
    <div style={{minHeight:"100vh",background:"var(--bg)",color:"white",fontFamily:"DM Sans,sans-serif"}}>
      <NavBar navigate={navigate} active="interview" onLogout={onLogout}/>
      <div style={{maxWidth:680,margin:"0 auto",padding:"60px 24px",textAlign:"center"}}>
        <div style={{width:88,height:88,borderRadius:"50%",background:"linear-gradient(135deg,#7C3AED,#6D28D9)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:42,margin:"0 auto 24px",boxShadow:"0 12px 40px rgba(124,58,237,0.4)"}}>🎯</div>
        <h1 style={{fontSize:30,fontWeight:700,marginBottom:10,letterSpacing:"-0.5px"}}>Ready for your interview?</h1>
        <p style={{color:"var(--text-subtle)",fontSize:15,marginBottom:36,lineHeight:1.7}}>The AI interviewer will ask adaptive questions calibrated to your resume and skill level. Your answers are analyzed in real-time for technical depth, communication, and confidence signals.</p>
        <Card style={{textAlign:"left",marginBottom:32}}>
          <div style={{fontWeight:600,marginBottom:16,fontSize:15}}>Interview Configuration</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
            {[["Target Role",targetRole],["Questions","5 adaptive turns"],["Duration","~20–30 minutes"],["Difficulty","Agent-controlled"],["Scoring","Technical + Comms + Confidence"],["Mode","Resume-aware adaptation"]].map(([k,v])=>(
              <div key={k} style={{background:"var(--surface)",borderRadius:10,padding:"11px 14px",border:"1px solid var(--border)"}}>
                <div style={{color:"var(--text-subtle)",fontSize:11,marginBottom:2}}>{k}</div>
                <div style={{color:"var(--text-soft)",fontSize:13,fontWeight:500}}>{v}</div>
              </div>
            ))}
          </div>
        </Card>
        <Btn onClick={startInterview} style={{padding:"14px 44px",fontSize:16,boxShadow:"0 8px 32px rgba(124,58,237,0.4)"}}>
          Begin Interview →
        </Btn>
      </div>
    </div>
  );

  if(phase==="ended")return(
    <div style={{minHeight:"100vh",background:"var(--bg)",color:"white",fontFamily:"DM Sans,sans-serif"}}>
      <NavBar navigate={navigate} active="interview" onLogout={onLogout}/>
      <div style={{maxWidth:600,margin:"0 auto",padding:"60px 24px",textAlign:"center"}}>
        <div style={{fontSize:60,marginBottom:20}}>🎉</div>
        <h1 style={{fontSize:30,fontWeight:700,marginBottom:10}}>Interview Complete!</h1>
        <p style={{color:"var(--text-subtle)",marginBottom:36,fontSize:14}}>Duration: {fmt(elapsed)} · {answered} answers submitted · {transcript.filter(t=>t.role==="candidate").length} responses analyzed</p>
        <div style={{display:"flex",justifyContent:"center",gap:24,marginBottom:40}}>
          <CircleScore score={Math.round(scores.technical)} label="Technical" size={88}/>
          <CircleScore score={Math.round(scores.communication)} label="Communication" size={88} color="#10B981"/>
          <CircleScore score={Math.round(scores.confidence)} label="Confidence" size={88} color="#2563EB"/>
          <CircleScore score={Math.round(scores.engagement)} label="Engagement" size={88} color="#F59E0B"/>
        </div>
        <div style={{display:"flex",gap:12,justifyContent:"center"}}>
          <Btn onClick={()=>navigate("report")} style={{padding:"13px 32px",fontSize:15}}>View Full Report →</Btn>
          <Btn variant="secondary" onClick={()=>{setPhase("ready");setQIdx(0);setTranscript([]);setElapsed(0);setAnswered(0);setScores({technical:58,communication:63,confidence:60,engagement:68});}}>Retry Interview</Btn>
        </div>
      </div>
    </div>

function App(){
  const [screen,setScreen]=useState("auth");
  const [isLight,setIsLight]=useState(false);
  const [user,setUser]=useState(appUser);
  useEffect(()=>{
    document.body.classList.toggle("light",isLight);
    document.body.classList.add("theme-transition");
  },[isLight]);
  useEffect(()=>{
    const token=localStorage.getItem("roleready_token");
    if(!token)return;
    fetch("http://localhost:3001/api/auth/me",{headers:{Authorization:`Bearer ${token}`}})
      .then(r=>r.ok?r.json():null)
      .then(data=>{
        if(data?.user){
          appUser=data.user;
          setUser(data.user);
          setScreen("dashboard");
        }
      })
      .catch(()=>{});
  },[]);
  const navigate=s=>setScreen(s);
  const handleAuth=u=>{
    appUser=u;
    setUser(u);
    navigate("dashboard");
  };
  const handleLogout=async()=>{
    const token=localStorage.getItem("roleready_token");
    localStorage.removeItem("roleready_token");
    if(token){
      fetch("http://localhost:3001/api/auth/logout",{method:"POST",headers:{Authorization:`Bearer ${token}`}}).catch(()=>{});
    }
    appUser={name:"User",email:"user@roleready.local",provider:"email"};
    setUser(appUser);
    navigate("auth");
  };
  const screens={
    auth:<AuthScreen onAuth={handleAuth}/>,
    dashboard:<DashboardScreen navigate={navigate} onLogout={handleLogout} user={user}/>,
    analysis:<AnalysisScreen navigate={navigate} onLogout={handleLogout} user={user}/>,
    jobs:<JobsScreen navigate={navigate} onLogout={handleLogout} user={user}/>,
    interview:<InterviewScreen navigate={navigate} onLogout={handleLogout} user={user}/>,
    report:<ReportScreen navigate={navigate} onLogout={handleLogout} user={user}/>,
  };
  return(
    <ThemeContext.Provider value={{isLight,toggleTheme:()=>setIsLight(v=>!v)}}>
      {screens[screen]||screens.auth}
    </ThemeContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
