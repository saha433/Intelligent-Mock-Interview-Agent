<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RoleReady AI — Intelligent Mock Interview Platform</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
    <style>
      :root {
        --bg: #080a12;
        --surface: #0a0c16;
        --card: #0f1120;
        --panel: #0d0f1c;
        --border: #1a1f35;
        --text: #ffffff;
        --text-soft: #e2e8f0;
        --text-muted: #cbd5e1;
        --text-subtle: #64748b;
        --text-faint: #4a5568;
        --purple: #443ac7;
        --purple-soft: #a78bfa;
        --hero-grid: rgba(148, 163, 184, 0.28);
        --hero-glow-a: rgba(249, 115, 22, 0.28);
        --hero-glow-b: rgba(124, 58, 237, 0.24);
        --hero-glow-c: rgba(37, 99, 235, 0.26);
      }
      body.light {
        --bg: #f6f7fb;
        --surface: #ffffff;
        --card: #ffffff;
        --panel: #f8fafc;
        --border: #dde3ef;
        --text: #111827;
        --text-soft: #1f2937;
        --text-muted: #475569;
        --text-subtle: #64748b;
        --text-faint: #94a3b8;
        --hero-grid: rgba(15, 23, 42, 0.22);
        --hero-glow-a: rgba(249, 115, 22, 0.24);
        --hero-glow-b: rgba(124, 58, 237, 0.18);
        --hero-glow-c: rgba(37, 99, 235, 0.18);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: var(--bg);
        font-family: "DM Sans", sans-serif;
        transition:
          background 0.25s ease,
          color 0.25s ease;
      }
      ::-webkit-scrollbar {
        width: 5px;
      }
      ::-webkit-scrollbar-track {
        background: var(--surface);
      }
      ::-webkit-scrollbar-thumb {
        background: #2d3748;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--text-faint);
      }
      @keyframes bounce {
        0%,
        80%,
        100% {
          transform: scale(0);
        }
        40% {
          transform: scale(1);
        }
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateX(-12px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      @keyframes glow {
        0%,
        100% {
          box-shadow: 0 0 20px rgba(124, 58, 237, 0.2);
        }
        50% {
          box-shadow: 0 0 40px rgba(124, 58, 237, 0.4);
        }
      }
      @keyframes barPulse {
        0%,
        100% {
          transform: scaleY(0.6);
        }
        50% {
          transform: scaleY(1);
        }
      }
      .fade-in {
        animation: fadeIn 0.4s ease both;
      }
      .slide-in {
        animation: slideIn 0.3s ease both;
      }
      textarea::placeholder {
        color: var(--text-faint);
      }
      input::placeholder {
        color: var(--text-faint);
      }
      input:focus,
      textarea:focus {
        border-color: #7c3aed !important;
        box-shadow: 0 0 0 2px rgba(124, 58, 237, 0.15);
      }
      button:hover {
        opacity: 0.9;
        transform: translateY(-1px);
      }
      button:active {
        transform: translateY(0);
      }
      button {
        transition: all 0.15s ease;
      }
      .card-hover:hover {
        border-color: #7c3aed66 !important;
        transition: border-color 0.2s;
      }
      .theme-transition * {
        transition:
          background-color 0.25s ease,
          border-color 0.25s ease,
          color 0.25s ease,
          box-shadow 0.25s ease;
      }
      @media print {
        body {
          background: #ffffff !important;
        }
        body * {
          visibility: hidden;
        }
        .report-print-area,
        .report-print-area * {
          visibility: visible;
        }
        .report-print-area {
          position: absolute !important;
          inset: 0 auto auto 0 !important;
          width: 100% !important;
          max-width: none !important;
          padding: 18px !important;
        }
        .no-print,
        .no-print * {
          display: none !important;
        }
        video {
          display: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useState, useEffect, useRef, useCallback, useContext } = React;
      const ThemeContext = React.createContext({
        isLight: false,
        toggleTheme: () => {},
      });

      // ─── APP STATE DEFAULTS ───────────────────────────────────────────────────────

      let candidate = {
        name: "Resume Candidate",
        email: "",
        targetRoles: ["Upload a resume to infer roles"],
        skills: ["Upload resume", "Parse skills", "Infer roles"],
        weakAreas: ["Upload resume to detect gaps"],
        projects: [
          {
            name: "Upload a resume to extract projects",
            tech: ["PDF", "TXT"],
            impact: "Awaiting resume",
          },
        ],
        experienceLevel: "Not analyzed",
        totalExperience: "Upload resume",
      };

      let appUser = {
        name: "User",
        email: "",
        provider: "email",
      };

      let resumeState = {
        uploaded: false,
        fileName: "",
        parseInfo: null,
      };

      let resumeAnalysis = {
        extractedSkills: [
          { name: "Python", level: 85, category: "Language" },
          { name: "React", level: 75, category: "Frontend" },
          { name: "SQL", level: 80, category: "Database" },
          { name: "REST APIs", level: 82, category: "Backend" },
          { name: "PostgreSQL", level: 78, category: "Database" },
          { name: "Docker", level: 65, category: "DevOps" },
          { name: "JavaScript", level: 72, category: "Language" },
          { name: "Node.js", level: 60, category: "Backend" },
        ],
        bestFitRoles: [
          {
            role: "Backend Developer",
            confidence: 91,
            reasoning: "Strong Python + REST API + PostgreSQL combination",
          },
          {
            role: "Full Stack Developer",
            confidence: 78,
            reasoning: "React + backend skills present, needs more TypeScript",
          },
          {
            role: "Data Engineer",
            confidence: 72,
            reasoning: "SQL + Python solid, missing Spark/Airflow experience",
          },
        ],
        interviewFocusAreas: [
          "Backend API design and REST principles",
          "Database optimization and indexing",
          "Docker containerization",
          "System design fundamentals",
          "Data structures & algorithms",
        ],
        weakMissingAreas: [
          {
            area: "System Design",
            severity: "high",
            suggestion: "Study distributed system patterns & CAP theorem",
          },
          {
            area: "Cloud (AWS/GCP)",
            severity: "high",
            suggestion: "Get hands-on with EC2, S3, Lambda",
          },
          {
            area: "Kubernetes",
            severity: "medium",
            suggestion: "Learn K8s basics and pod management",
          },
          {
            area: "Message Queues",
            severity: "medium",
            suggestion: "Learn Kafka or RabbitMQ basics",
          },
          {
            area: "CI/CD Pipelines",
            severity: "low",
            suggestion: "Practice GitHub Actions or Jenkins",
          },
        ],
      };

      let currentJobRecommendations = [];
      let jobRecommendationSource = "";

      const interviewQuestions = [
        {
          id: 1,
          question:
            "Walk me through the most relevant project from your resume. Explain the architecture, tradeoffs, and impact.",
          difficulty: "Medium",
          category: "Project Deep-dive",
          keywords: [
            "architecture",
            "API",
            "database",
            "scalability",
            "endpoints",
            "REST",
            "cache",
            "caching",
            "rate",
            "limit",
          ],
          followUpEasy:
            "What technologies did you use and why did you choose them?",
          followUpHard:
            "How would you scale this API to handle 1 million requests per day?",
        },
        {
          id: 2,
          question:
            "Design a role-relevant system for your target job. Start with requirements, data model, APIs, and scaling tradeoffs.",
          difficulty: "Hard",
          category: "System Design",
          keywords: [
            "hash",
            "database",
            "caching",
            "Redis",
            "scalability",
            "load",
            "balancer",
            "collision",
            "encode",
            "CDN",
            "sharding",
          ],
          followUpEasy:
            "Start with just the core data model — what tables would you need?",
          followUpHard:
            "How would you handle 100M URLs with sub-10ms redirect latency globally?",
        },
        {
          id: 3,
          question:
            "What are database indexes, and what tradeoffs do they introduce?",
          difficulty: "Medium",
          category: "Database",
          keywords: [
            "index",
            "B-tree",
            "performance",
            "write",
            "read",
            "storage",
            "tradeoff",
            "query",
            "optimize",
            "slow",
            "fast",
          ],
          followUpEasy:
            "Can you give a simple example of when you'd add an index to a table?",
          followUpHard:
            "Explain partial indexes, covering indexes, and when composite indexes outperform single-column ones.",
        },
        {
          id: 4,
          question:
            "How would you deploy your REST API using Docker in a production environment?",
          difficulty: "Medium",
          category: "DevOps",
          keywords: [
            "Docker",
            "container",
            "image",
            "port",
            "environment",
            "compose",
            "registry",
            "dockerfile",
            "build",
            "run",
            "volume",
          ],
          followUpEasy: "What is a Dockerfile and what goes inside it?",
          followUpHard:
            "How does Docker Compose differ from Kubernetes, and when would you choose each?",
        },
        {
          id: 5,
          question:
            "Tell me about a technical challenge you faced in one of your projects and how you resolved it.",
          difficulty: "Easy",
          category: "Behavioral",
          keywords: [
            "problem",
            "solution",
            "learned",
            "team",
            "debugging",
            "approach",
            "challenge",
            "result",
            "fixed",
            "improved",
          ],
          followUpEasy:
            "What was the most important lesson you took from that experience?",
          followUpHard:
            "How would you architect the solution differently now with what you know?",
        },
      ];

      const feedbackReport = {
        overallScore: 0,
        roleReadiness: 0,
        technicalScore: 0,
        communicationScore: 0,
        confidenceScore: 0,
        engagementScore: 0,
        strengths: ["Complete a mock interview to generate strengths."],
        weaknesses: ["Complete a mock interview to generate coaching gaps."],
        questionFeedback: [
          {
            question: "Interview not completed",
            score: 0,
            feedback: "No interview transcript is available yet.",
            improvement:
              "Start or upload a mock interview to generate adaptive feedback.",
          },
        ],
        prepPlan: [
          {
            day: 1,
            focus: "Start Interview",
            tasks: ["Complete a mock interview", "Generate a coaching report"],
          },
          {
            day: 2,
            focus: "Review Feedback",
            tasks: ["Read the generated gaps", "Practice the weakest area"],
          },
          {
            day: 3,
            focus: "Role Practice",
            tasks: ["Retry with a chosen target role", "Export the report"],
          },
        ],
      };

      let generatedReport = null;
      let lastInterviewSession = null;
      let lastInterviewRecordingUrl = null;

      // ─── UTILITIES ────────────────────────────────────────────────────────────────

      const scoreColor = (s) =>
        s >= 80 ? "#10B981" : s >= 65 ? "#F59E0B" : "#EF4444";
      const scoreLabel = (s) =>
        s >= 80 ? "Strong" : s >= 65 ? "Good" : "Needs Work";
      const diffColor = (d) =>
        d === "Easy" ? "#10B981" : d === "Medium" ? "#F59E0B" : "#EF4444";
      const priColor = (p) =>
        p === "High" ? "#10B981" : p === "Medium" ? "#F59E0B" : "#94A3B8";
      const catColor = (c) =>
        ({
          Language: "#7C3AED",
          Frontend: "#2563EB",
          Backend: "#059669",
          Database: "#D97706",
          DevOps: "#DC2626",
        })[c] || "#7C3AED";
      const initials = (name) =>
        String(name || "Candidate")
          .split(/\s+/)
          .filter(Boolean)
          .slice(0, 2)
          .map((p) => p[0]?.toUpperCase())
          .join("") || "C";
      const clampScore = (value) =>
        Math.max(0, Math.min(100, Math.round(value || 0)));
      const escapeHtml = (value) =>
        String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");

      function resetResumeState() {
        resumeState = { uploaded: false, fileName: "", parseInfo: null };
        candidate = {
          name: "Resume Candidate",
          email: "",
          targetRoles: ["Upload a resume to infer roles"],
          skills: ["Upload resume", "Parse skills", "Infer roles"],
          weakAreas: ["Upload resume to detect gaps"],
          projects: [
            {
              name: "Upload a resume to extract projects",
              tech: ["PDF", "TXT"],
              impact: "Awaiting resume",
            },
          ],
          experienceLevel: "Not analyzed",
          totalExperience: "Upload resume",
        };
        generatedReport = null;
        lastInterviewSession = null;
        if (lastInterviewRecordingUrl)
          URL.revokeObjectURL(lastInterviewRecordingUrl);
        lastInterviewRecordingUrl = null;
        currentJobRecommendations = [];
        jobRecommendationSource = "";
      }

      function analyzeAnswer(text, question) {
        const lower = text.toLowerCase();
        const words = text.trim().split(/\s+/).length;
        const hits = question.keywords.filter((k) =>
          lower.includes(k.toLowerCase()),
        ).length;
        const ratio = hits / question.keywords.length;
        let tD = 0,
          cD = 0,
          mD = 0,
          nextDiff = question.difficulty,
          nextQ = null,
          reasoning = "";
        if (words < 20) {
          tD = -8;
          cD = -6;
          mD = -5;
          nextDiff = "Easy";
          nextQ = question.followUpEasy;
          reasoning =
            "Answer was very brief. Switching to a simpler follow-up to help the candidate build confidence and elaborate.";
        } else if (ratio > 0.45 && words > 60) {
          tD = 10;
          cD = 8;
          mD = 7;
          nextDiff = "Hard";
          nextQ = question.followUpHard;
          reasoning =
            "Strong technical answer with depth and relevant keywords. Increasing difficulty to probe advanced knowledge.";
        } else if (ratio > 0.25) {
          tD = 5;
          cD = 4;
          mD = 4;
          nextDiff = question.difficulty;
          nextQ = null;
          reasoning =
            "Solid answer covering key concepts. Maintaining current difficulty. Candidate is performing well.";
        } else {
          tD = -3;
          cD = -2;
          mD = 0;
          nextDiff = "Easy";
          nextQ = question.followUpEasy;
          reasoning =
            "Answer missed key technical concepts. Asking a clarifying follow-up before advancing to the next topic.";
        }
        return { tD, cD, mD, nextDiff, nextQ, reasoning };
      }

      function buildUiFallbackJobs() {
        const roles = resumeAnalysis.bestFitRoles?.length
          ? resumeAnalysis.bestFitRoles
          : [{ role: "Target Role", confidence: 65 }];
        const skills = (resumeAnalysis.extractedSkills || [])
          .map((skill) => skill.name)
          .filter(Boolean);
        return roles.slice(0, 4).map((role, index) => {
          const matchScore = clampScore(
            (role.confidence || 65) - index * 5 + Math.min(skills.length, 8),
          );
          const missing =
            resumeAnalysis.weakMissingAreas
              ?.slice(index, index + 2)
              .map((gap) => gap.area) || [];
          return {
            id: `resume-fit-${index + 1}`,
            title: role.role,
            company: "Resume-fit opportunity",
            location: index % 2 ? "Remote" : "Target market",
            type: /intern|trainee/i.test(role.role) ? "Internship" : "Role",
            salary: "Not listed",
            matchScore,
            matchingSkills: skills.slice(0, 5),
            missingSkills: missing,
            whyFits:
              role.reasoning ||
              `Matched from ${candidate.name || "the candidate"}'s parsed skills and project evidence.`,
            priority:
              matchScore >= 82 ? "High" : matchScore >= 68 ? "Medium" : "Low",
            postedDays: 0,
            logo: role.role
              .split(/\s+/)
              .slice(0, 2)
              .map((part) => part[0])
              .join("")
              .toUpperCase(),
            logoColor: ["#7C3AED", "#2563EB", "#059669", "#D97706"][index % 4],
          };
        });
      }

      function buildUiFallbackReport(session) {
        const scores = session?.scores || {};
        const avg = clampScore(
          ((scores.technical || 60) +
            (scores.communication || 60) +
            (scores.confidence || 60) +
            (scores.engagement || 60)) /
            4,
        );
        const role =
          session?.targetRole ||
          resumeAnalysis.bestFitRoles?.[0]?.role ||
          "target role";
        const gaps = resumeAnalysis.weakMissingAreas?.length
          ? resumeAnalysis.weakMissingAreas.map((gap) => gap.area)
          : ["answer structure", "technical depth", "evidence and metrics"];
        return {
          source: "session-fallback-report",
          warning: "Generated locally from the captured interview session.",
          overallScore: avg,
          roleReadiness: clampScore(
            (scores.technical || avg) * 0.65 +
              (scores.communication || avg) * 0.35,
          ),
          technicalScore: clampScore(scores.technical || avg),
          communicationScore: clampScore(scores.communication || avg),
          confidenceScore: clampScore(scores.confidence || avg),
          engagementScore: clampScore(scores.engagement || avg),
          strengths: [
            `Completed an adaptive interview for ${role}`,
            `Resume evidence was mapped to ${resumeAnalysis.bestFitRoles?.length || 1} possible role path${resumeAnalysis.bestFitRoles?.length === 1 ? "" : "s"}`,
            "Transcript and scoring signals were captured for coaching",
          ],
          weaknesses: gaps.slice(0, 4).map((gap) => `Improve ${gap}`),
          questionFeedback: (session?.transcript || [])
            .filter((item) => item.role === "candidate")
            .slice(0, 5)
            .map((item, index) => ({
              question: `Adaptive turn ${index + 1}`,
              score: avg,
              feedback:
                "The response was captured, but the cloud report agent was unavailable. Use clearer context, tradeoffs, and measurable outcomes.",
              improvement: `For ${role}, answer with context, decision, tradeoff, result, and what you would improve next.`,
            })),
          prepPlan: Array.from({ length: 7 }, (_, index) => ({
            day: index + 1,
            focus: index === 0 ? role : gaps[index % gaps.length],
            tasks: [
              `Practice one ${role} answer with concrete evidence`,
              "Add metrics, constraints, and tradeoffs to the answer",
            ],
          })),
          coachingSummary: `${candidate.name || "The candidate"} completed a mock interview for ${role}. This backup report was generated from the captured session scores and resume-derived gaps.`,
        };
      }

      // ─── SHARED UI ────────────────────────────────────────────────────────────────

      function CircleScore({ score, size = 80, stroke = 7, label, color }) {
        const r = (size - stroke * 2) / 2,
          circ = 2 * Math.PI * r,
          c = color || scoreColor(score);
        return (
          <div
            style={{
              display: "flex",
              flexDirection: "column",
              alignItems: "center",
              gap: 4,
            }}
          >
            <svg width={size} height={size}>
              <circle
                cx={size / 2}
                cy={size / 2}
                r={r}
                fill="none"
                stroke="var(--border)"
                strokeWidth={stroke}
              />
              <circle
                cx={size / 2}
                cy={size / 2}
                r={r}
                fill="none"
                stroke={c}
                strokeWidth={stroke}
                strokeDasharray={circ}
                strokeDashoffset={circ * (1 - score / 100)}
                strokeLinecap="round"
                transform={`rotate(-90 ${size / 2} ${size / 2})`}
                style={{ transition: "stroke-dashoffset 1.2s ease" }}
              />
              <text
                x={size / 2}
                y={size / 2 + 5}
                textAnchor="middle"
                fill="var(--text)"
                fontSize={size < 60 ? 11 : 14}
                fontWeight="700"
                fontFamily="DM Sans"
              >
                {score}
              </text>
            </svg>
            {label && (
              <span
                style={{
                  color: "var(--text-subtle)",
                  fontSize: 10,
                  fontWeight: 500,
                }}
              >
                {label}
              </span>
            )}
          </div>
        );
      }

      function SkillBar({ name, level, category }) {
        const c = catColor(category);
        return (
          <div style={{ display: "flex", flexDirection: "column", gap: 5 }}>
            <div
              style={{
                display: "flex",
                justifyContent: "space-between",
                alignItems: "center",
              }}
            >
              <span style={{ color: "var(--text-muted)", fontSize: 13 }}>
                {name}
              </span>
              <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                <span
                  style={{
                    fontSize: 10,
                    padding: "1px 8px",
                    borderRadius: 20,
                    background: `${c}18`,
                    color: c,
                    border: `1px solid ${c}30`,
                    fontWeight: 500,
                  }}
                >
                  {category}
                </span>
                <span style={{ color: "var(--text-subtle)", fontSize: 12 }}>
                  {level}%
                </span>
              </div>
            </div>
            <div
              style={{
                height: 5,
                background: "var(--border)",
                borderRadius: 3,
                overflow: "hidden",
              }}
            >
              <div
                style={{
                  height: 5,
                  width: `${level}%`,
                  background: `linear-gradient(90deg,${c},${c}99)`,
                  borderRadius: 3,
                  transition: "width 1.2s ease",
                }}
              />
            </div>
          </div>
        );
      }

      function Tag({ children, color = "#7C3AED" }) {
        return (
          <span
            style={{
              fontSize: 11,
              padding: "2px 9px",
              borderRadius: 20,
              background: `${color}18`,
              color,
              border: `1px solid ${color}35`,
              fontWeight: 500,
              whiteSpace: "nowrap",
            }}
          >
            {children}
          </span>
        );
      }

      function Card({ children, style = {}, className = "", onClick }) {
        return (
          <div
            onClick={onClick}
            className={`fade-in ${className}`}
            style={{
              background: "var(--card)",
              border: "1px solid var(--border)",
              borderRadius: 16,
              padding: "18px 20px",
              ...style,
            }}
          >
            {children}
          </div>
        );
      }

      function LockedCard({
        title = "Add your resume to unlock",
        body = "Upload a PDF or TXT resume so the agent can personalize this section.",
        action,
        navigate,
      }) {
        return (
          <Card
            style={{
              minHeight: 180,
              display: "flex",
              flexDirection: "column",
              alignItems: "center",
              justifyContent: "center",
              textAlign: "center",
              gap: 12,
            }}
          >
            <div
              style={{
                width: 46,
                height: 46,

      function ClickSpark({
        sparkColor = "#ffffff",
        sparkSize = 10,
        sparkRadius = 15,
        sparkCount = 8,
        duration = 400,
        easing = "ease-out",
        extraScale = 1,
        children,
      }) {
        const canvasRef = useRef(null);
        const sparksRef = useRef([]);

        useEffect(() => {
          const canvas = canvasRef.current;
          if (!canvas) return;
          const parent = canvas.parentElement;
          if (!parent) return;
          let resizeTimeout;
          const resizeCanvas = () => {
            const { width, height } = parent.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            const w = Math.max(1, Math.floor(width * dpr));
            const h = Math.max(1, Math.floor(height * dpr));
            if (canvas.width !== w || canvas.height !== h) {
              canvas.width = w;
              canvas.height = h;
              canvas.style.width = `${width}px`;
              canvas.style.height = `${height}px`;
            }
          };
          const handleResize = () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(resizeCanvas, 100);
          };
          const ro = new ResizeObserver(handleResize);
          ro.observe(parent);
          resizeCanvas();
          return () => {
            ro.disconnect();
            clearTimeout(resizeTimeout);
          };
        }, []);

        const easeFunc = useCallback(
          (t) => {
            if (easing === "linear") return t;
            if (easing === "ease-in") return t * t;
            if (easing === "ease-in-out")
              return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
            return t * (2 - t);
          },
          [easing],
        );

        useEffect(() => {
          const canvas = canvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext("2d");
          let animationId;
          const draw = (timestamp) => {
            const dpr = window.devicePixelRatio || 1;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            sparksRef.current = sparksRef.current.filter((spark) => {
              const elapsed = timestamp - spark.startTime;
              if (elapsed >= duration) return false;
              const progress = elapsed / duration;
              const eased = easeFunc(progress);
              const distance = eased * sparkRadius * extraScale * dpr;
              const lineLength = sparkSize * (1 - eased) * dpr;
              const x1 = spark.x + distance * Math.cos(spark.angle);
              const y1 = spark.y + distance * Math.sin(spark.angle);
              const x2 =
                spark.x + (distance + lineLength) * Math.cos(spark.angle);
              const y2 =
                spark.y + (distance + lineLength) * Math.sin(spark.angle);
              ctx.strokeStyle = sparkColor;
              ctx.lineWidth = 2 * dpr;
              ctx.beginPath();
              ctx.moveTo(x1, y1);
              ctx.lineTo(x2, y2);
              ctx.stroke();
              return true;
            });
            animationId = requestAnimationFrame(draw);
          };
          animationId = requestAnimationFrame(draw);
          return () => cancelAnimationFrame(animationId);
        }, [
          sparkColor,
          sparkSize,
          sparkRadius,
          sparkCount,
          duration,
          easeFunc,
          extraScale,
        ]);

        const handleClick = (e) => {
          const canvas = canvasRef.current;
          if (!canvas) return;
          const rect = canvas.getBoundingClientRect();
          const dpr = window.devicePixelRatio || 1;
          const x = (e.clientX - rect.left) * dpr;
          const y = (e.clientY - rect.top) * dpr;
          const now = performance.now();
          sparksRef.current.push(
            ...Array.from({ length: sparkCount }, (_, i) => ({
              x,
              y,
              angle: (2 * Math.PI * i) / sparkCount,
              startTime: now,
            })),
          );
        };

        return (
          <div
            onClick={handleClick}
            style={{ position: "relative", width: "100%", minHeight: "100vh" }}
          >
            <canvas
              ref={canvasRef}
              style={{
                width: "100%",
                height: "100%",
                display: "block",
                userSelect: "none",
                position: "fixed",
                inset: 0,
                pointerEvents: "none",
                zIndex: 9999,
              }}
            />
            {children}
          </div>
        );
      }

      async function authRequest(path, payload) {
        const res = await fetch(`http://localhost:3001${path}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (!res.ok || !data.ok)
          throw new Error(data.error || "Authentication failed");
        if (data.token) localStorage.setItem("roleready_token", data.token);
        return data.user;
      }

            if (data.candidate) candidate = data.candidate;
            const nextParseInfo = {
              source: data.source,
              textPreview: data.textPreview,
              warning: data.warning,
            };
            resumeState = {
              uploaded: true,
              fileName: file.name || "Resume.pdf",

            lastInterviewSession = null;

        if (!resumeState.uploaded) {

              body="Upload your resume first so the agent can rank jobs against your real skills and target role."
            />
          );
        }
        const [expanded, setExpanded] = useState(null);
        const [filter, setFilter] = useState("All");
        const [jobs, setJobs] = useState(
          currentJobRecommendations.length ? currentJobRecommendations : [],
        );
        const [jobSource, setJobSource] = useState(jobRecommendationSource);
        const [loadingJobs, setLoadingJobs] = useState(
          !currentJobRecommendations.length,
        );
        const [jobWarning, setJobWarning] = useState("");
        const filters = ["All", "High Match", "Internship", "Remote"];

        useEffect(() => {
          let cancelled = false;
          setLoadingJobs(true);
          setJobWarning("");
          requestJobRecommendations()
            .then((data) => {
              if (cancelled) return;
              currentJobRecommendations = data.jobs || [];
              jobRecommendationSource = data.source || "fallback-job-pool";
              setJobs(currentJobRecommendations);
              setJobSource(jobRecommendationSource);
              setJobWarning(data.warning || "");
            })
            .catch((err) => {
              if (cancelled) return;
              currentJobRecommendations = buildUiFallbackJobs();
              jobRecommendationSource = "resume-fit-fallback";
              setJobs(currentJobRecommendations);
              setJobSource("resume-fit-fallback");
              setJobWarning(err.message || "Could not fetch live jobs.");
            })
            .finally(() => {
              if (!cancelled) setLoadingJobs(false);
            });
          return () => {
            cancelled = true;
          };
        }, []);

        const filtered = jobs.filter((j) => {
          if (filter === "All") return true;
          if (filter === "High Match") return j.matchScore >= 80;
          if (filter === "Internship") return j.type === "Internship";
          if (filter === "Remote") return j.location === "Remote";
          return true;

      async function requestInterviewTurn(payload) {
        const res = await fetch("http://localhost:3001/api/interview-turn", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (!res.ok || !data.ok)
          throw new Error(data.error || "Interview agent failed");
        return data.turn;
      }

      async function requestGeneratedReport(payload) {
        const res = await fetch("http://localhost:3001/api/generate-report", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (!res.ok || !data.ok)
          throw new Error(data.error || "Report agent failed");
        return data.report;
      }

      async function requestJobRecommendations() {
        const res = await fetch("http://localhost:3001/api/recommend-jobs", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ candidate, resumeAnalysis }),
        });
        const data = await res.json();

        const analyzeVideoFrame = async () => {
          const video = videoRef.current;
          if (!video || video.readyState < 2) return null;

          if ("FaceDetector" in window && !faceDetectorRef.current) {
            try {
              faceDetectorRef.current = new window.FaceDetector({
                fastMode: true,
                maxDetectedFaces: 1,
              });
            } catch (err) {
              faceDetectorRef.current = false;
            }
          }

          if (faceDetectorRef.current) {
            try {
              const faces = await faceDetectorRef.current.detect(video);
              if (faces?.length) {
                const box = faces[0].boundingBox;
                const centerX = box.x + box.width / 2;
                const centerY = box.y + box.height / 2;
                const xOffset =
                  Math.abs(centerX - video.videoWidth / 2) /
                  (video.videoWidth / 2 || 1);
                const yOffset =
                  Math.abs(centerY - video.videoHeight / 2) /
                  (video.videoHeight / 2 || 1);
                return {
                  facePresent: true,
                  eyeContact: clampScore(94 - xOffset * 55 - yOffset * 25),
                  posture: clampScore(90 - xOffset * 35 - yOffset * 20),
                  source: "browser-face-detector",
                };
              }
            } catch (err) {
              faceDetectorRef.current = false;
            }
          }

          const canvas = videoCanvasRef.current;
          const ctx = canvas.getContext("2d", { willReadFrequently: true });
          canvas.width = 160;
          canvas.height = 90;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const image = ctx.getImageData(0, 0, canvas.width, canvas.height);
          let brightness = 0;
          let centerBrightness = 0;
          let centerSamples = 0;
          let diff = 0;
          const previous = previousFrameRef.current;

          for (let i = 0; i < image.data.length; i += 4) {
            const avg =
              (image.data[i] + image.data[i + 1] + image.data[i + 2]) / 3;
            brightness += avg;
            if (previous) diff += Math.abs(avg - previous[i / 4]);
            const px = (i / 4) % canvas.width;
            const py = Math.floor(i / 4 / canvas.width);
            if (px > 50 && px < 110 && py > 18 && py < 72) {
              centerBrightness += avg;
              centerSamples++;
            }
          }

          const samples = image.data.length / 4;
          const nextFrame = new Uint8Array(samples);
          for (let i = 0; i < image.data.length; i += 4)
            nextFrame[i / 4] =
              (image.data[i] + image.data[i + 1] + image.data[i + 2]) / 3;
          previousFrameRef.current = nextFrame;

          brightness = brightness / samples;
          diff = previous ? diff / samples : 0;
          centerBrightness = centerSamples
            ? centerBrightness / centerSamples
            : brightness;
          const facePresent =
            brightness > 24 && centerBrightness >= brightness * 0.9;
          const steadiness = clampScore(100 - diff * 5);

          return {
            facePresent,
            eyeContact: facePresent ? clampScore(58 + steadiness * 0.28) : 28,
            posture: facePresent ? clampScore(60 + steadiness * 0.25) : 32,
            source: "browser-video-heuristic",
          };
        };

        const startSpeechRecognition = () => {
          const SpeechRecognition =
            window.SpeechRecognition || window.webkitSpeechRecognition;
          if (!SpeechRecognition || speechRef.current) return;
          const recognition = new SpeechRecognition();
          recognition.continuous = true;
          recognition.interimResults = true;
          recognition.lang = "en-US";
          recognition.onresult = (event) => {
            let latest = "";
            for (let i = event.resultIndex; i < event.results.length; i++) {
              latest += event.results[i][0].transcript;
            }
            if (latest.trim()) setLiveSpeech(latest.trim());
          };
          recognition.onerror = () => {};
          recognition.onend = () => {
            if (mediaStreamRef.current) {
              try {
                recognition.start();
              } catch (err) {}
            }
          };
          speechRef.current = recognition;
          try {
            recognition.start();
          } catch (err) {}
        };

        const startRecording = (stream) => {
          if (!window.MediaRecorder || mediaRecorderRef.current) return;
          try {
            const mimeType = MediaRecorder.isTypeSupported(
              "video/webm;codecs=vp8,opus",
            )
              ? "video/webm;codecs=vp8,opus"
              : "video/webm";
            recordingChunksRef.current = [];
            const recorder = new MediaRecorder(stream, { mimeType });
            recorder.ondataavailable = (event) => {
              if (event.data?.size) recordingChunksRef.current.push(event.data);
            };
            recorder.onstop = () => {
              if (!recordingChunksRef.current.length) {
                setRecordingState("unavailable");
                return;
              }
              if (lastInterviewRecordingUrl)
                URL.revokeObjectURL(lastInterviewRecordingUrl);
              const blob = new Blob(recordingChunksRef.current, {
                type: mimeType,
              });
              lastInterviewRecordingUrl = URL.createObjectURL(blob);
              setRecordingUrl(lastInterviewRecordingUrl);
              setRecordingState("saved");
              recordingChunksRef.current = [];
            };
            mediaRecorderRef.current = recorder;
            recorder.start(1000);
            setRecordingState("recording");
          } catch (err) {
            setRecordingState("unavailable");
          }
        };

        const stopRecording = () => {
          const recorder = mediaRecorderRef.current;
          if (!recorder) return;
          mediaRecorderRef.current = null;
          if (recorder.state !== "inactive") {
            try {
              recorder.stop();
            } catch (err) {
              setRecordingState("unavailable");
            }
          }
        };

        const stopAV = () => {
          if (avIntervalRef.current) {
            clearInterval(avIntervalRef.current);
            avIntervalRef.current = null;
          }
          if (speechRef.current) {
            try {
              speechRef.current.onend = null;
              speechRef.current.stop();
            } catch (err) {}
            speechRef.current = null;
          }
          stopRecording();
          if (mediaStreamRef.current) {
            mediaStreamRef.current.getTracks().forEach((track) => track.stop());
            mediaStreamRef.current = null;
          }
          if (audioCtxRef.current) {
            audioCtxRef.current.close().catch(() => {});
            audioCtxRef.current = null;
          }
          analyserRef.current = null;
          previousFrameRef.current = null;
          lastSpeakingRef.current = false;
          silenceFramesRef.current = 0;
          setAvEnabled(false);
        };

        const startAV = async () => {
          if (avEnabled || mediaStreamRef.current) return;
          if (!navigator.mediaDevices?.getUserMedia) {
            setAvError(
              "This browser does not expose camera/mic analysis. Text interview still works.",
            );
            return;
          }
          try {
            setAvError("Requesting camera and microphone permission...");
            const stream = await navigator.mediaDevices.getUserMedia({
              video: {
                width: { ideal: 960 },
                height: { ideal: 540 },
                facingMode: "user",
              },
              audio: {
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: true,
              },
            });
            mediaStreamRef.current = stream;
            setAvEnabled(true);
            setAvError("");
            if (videoRef.current) {
              videoRef.current.srcObject = stream;
              await videoRef.current.play().catch(() => {});
            }

            startRecording(stream);
            const AudioContext =
              window.AudioContext || window.webkitAudioContext;
            if (AudioContext) {
              const audioCtx = new AudioContext();
              const source = audioCtx.createMediaStreamSource(stream);
              const analyser = audioCtx.createAnalyser();
              analyser.fftSize = 1024;
              source.connect(analyser);
              audioCtxRef.current = audioCtx;
              analyserRef.current = analyser;
            }

            startSpeechRecognition();
            avIntervalRef.current = setInterval(async () => {
              const analyser = analyserRef.current;
              const data = analyser ? new Uint8Array(analyser.fftSize) : null;
              let audioLevel = 0;
              if (analyser && data) {
                analyser.getByteTimeDomainData(data);
                let sum = 0;
                for (let i = 0; i < data.length; i++) {
                  const normalized = (data[i] - 128) / 128;
                  sum += normalized * normalized;
                }
                audioLevel = clampScore(Math.sqrt(sum / data.length) * 240);
              }

              const speaking = audioLevel > 8;
              const videoSignals = await analyzeVideoFrame();

              setAvMetrics((prev) => {
                let pauseCount = prev.pauseCount;
                if (
                  speaking &&
                  !lastSpeakingRef.current &&
                  silenceFramesRef.current >= 3
                )
                  pauseCount += 1;
                if (speaking) silenceFramesRef.current = 0;
                else silenceFramesRef.current += 1;
                lastSpeakingRef.current = speaking;

                const eyeContact = videoSignals
                  ? videoSignals.eyeContact
                  : prev.eyeContact;
                const posture = videoSignals
                  ? videoSignals.posture
                  : prev.posture;
                const clarity = clampScore(
                  speaking ? 62 + audioLevel * 0.45 : prev.clarity * 0.96,
                );
                const confidence = clampScore(
                  clarity * 0.42 + eyeContact * 0.36 + posture * 0.22,
                );
                const engagement = clampScore(
                  eyeContact * 0.42 + posture * 0.36 + (speaking ? 18 : 8),
                );
                const stress = clampScore(
                  105 - confidence + (pauseCount > 5 ? 8 : 0),
                );
                const next = {
                  audioLevel,
                  speaking,
                  pauseCount,
                  clarity,
                  confidence,
                  facePresent: videoSignals
                    ? videoSignals.facePresent
                    : prev.facePresent,
                  eyeContact,
                  posture,
                  engagement,
                  stress,
                  frames: prev.frames + 1,
                  source: videoSignals?.source || "browser-audio",
                };
                setScores((s) => ({
                  ...s,
                  communication: clampScore(
                    s.communication * 0.86 + clarity * 0.14,
                  ),
                  confidence: clampScore(
                    s.confidence * 0.84 + confidence * 0.16,
                  ),
                  engagement: clampScore(
                    s.engagement * 0.84 + engagement * 0.16,
                  ),
                }));
                return next;
              });
            }, 700);
          } catch (err) {
            setAvEnabled(false);
            setAvError(
              `Camera/mic did not start: ${err.name || "Permission/device error"}. Check browser permission, close other apps using the camera, then press Enable camera/mic.`,
            );
            setRecordingState("unavailable");
          }
        };

        useEffect(() => () => stopAV(), []);

        const finishInterview = async () => {

        const startInterview = async () => {

                technical: Math.max(

                  Math.min(100, turn.scores.technical ?? scores.technical),

                  10,
                  Math.min(
                    100,
                    turn.scores.communication ?? scores.communication,
                  ),
                ),
                confidence: Math.max(
                  10,
                  Math.min(100, turn.scores.confidence ?? scores.confidence),
                ),
                engagement: Math.max(
                  10,
                  Math.min(100, turn.scores.engagement ?? scores.engagement),
                ),
              });
            }
            setDifficulty(turn.difficulty || difficulty);
            setReasoning(
              turn.reasoning ||
                "The agent analyzed the last response and selected the next question based on resume gaps.",
            );
            setQuestionCategory(turn.category || "Adaptive Follow-up");
            setAgentSource(turn.source || "agent");
            setCoachSignal(turn.coachSignal || "Adaptive follow-up selected");
            const nq =
              answered + 1 >= totalQuestions
                ? "Great session. You have completed the adaptive interview. End the interview to generate your coaching report."
                : turn.nextQuestion;
            setCurrentQ(nq);
            setTranscript((t) => [...t, { role: "ai", text: nq }]);
            setQIdx((i) => Math.min(totalQuestions - 1, i + 1));
          } catch (err) {
            const q = interviewQuestions[qIdx % interviewQuestions.length];
            const {
              tD,

              mD,
              nextDiff,
              nextQ,
              reasoning: r,
            } = analyzeAnswer(submitted, q);
            setScores((s) => ({
              technical: Math.max(10, Math.min(100, s.technical + tD)),
              communication: Math.max(10, Math.min(100, s.communication + mD)),
              confidence: Math.max(10, Math.min(100, s.confidence + cD)),
              engagement: Math.max(10, Math.min(100, s.engagement + 3)),
            }));
            setDifficulty(nextDiff);
            setReasoning(`Local fallback: ${r}`);
            setQuestionCategory("Fallback Follow-up");
            setAgentSource("local-fallback");
            setCoachSignal("Network fallback active");
            const nq =
              answered + 1 >= totalQuestions
                ? "Great session. End the interview to generate your coaching report."
                : nextQ ||
                  interviewQuestions[(qIdx + 1) % interviewQuestions.length]
                    .question;
            setCurrentQ(nq);
            setTranscript((t) => [...t, { role: "ai", text: nq }]);
            setQIdx((i) => Math.min(totalQuestions - 1, i + 1));
          } finally {
            setThinking(false);
          }

        const ScoreW = ({ label, val, color, icon }) => (
          <div
            style={{
              background: "var(--bg)",

              padding: "13px 14px",
              border: "1px solid var(--border)",

              style={{ display: "flex", alignItems: "center", marginBottom: 8 }}
            >

                }}

              </span>
            </div>
            <div
              style={{

                marginBottom: 7,

              }}
            >
              {label}
            </div>
            <div
              style={{
                height: 4,
                background: "var(--border)",
                borderRadius: 2,
              }}
            >
              <div
                style={{
                  height: 4,
                  width: `${val}%`,
                  background: `linear-gradient(90deg,${color},${color}70)`,
                  borderRadius: 2,
                  transition: "width 0.9s ease",
                }}
              />
            </div>
          </div>
        );

        const readMediaDuration = (file) =>
          new Promise((resolve) => {
            const url = URL.createObjectURL(file);
            const media = document.createElement(
              file.type.startsWith("audio/") ? "audio" : "video",
            );
            const finish = (duration = 0) => {
              URL.revokeObjectURL(url);
              resolve(Number.isFinite(duration) ? Math.round(duration) : 0);
            };
            media.preload = "metadata";
            media.onloadedmetadata = () => finish(media.duration);
            media.onerror = () => finish(0);
            media.src = url;
            setTimeout(() => finish(0), 3500);
          });

        const handleRecordedInterviewUpload = async (event) => {
          const file = event.target.files?.[0];
          event.target.value = "";
          if (!file) return;
          if (
            !file.type.startsWith("video/") &&
            !file.type.startsWith("audio/")
          ) {
            setRecordedUploadError(
              "Upload a video or audio interview recording.",
            );
            return;
          }
          setRecordedUploadLoading(true);
          setRecordedUploadError("");
          try {
            const durationSeconds = await readMediaDuration(file);
            if (lastInterviewRecordingUrl)
              URL.revokeObjectURL(lastInterviewRecordingUrl);
            lastInterviewRecordingUrl = URL.createObjectURL(file);
            setRecordingUrl(lastInterviewRecordingUrl);
            setRecordingState("saved");

            const durationMinutes = durationSeconds
              ? `${Math.max(1, Math.round(durationSeconds / 60))} minute`
              : "uploaded";
            const uploadedSession = {
              candidate,
              resumeAnalysis,
              targetRole,
              questionCount: totalQuestions,
              durationSeconds,
              answered: 1,
              transcript: [
                {
                  role: "ai",
                  text: `Evaluate this prerecorded interview for ${targetRole}.`,
                },
                {
                  role: "candidate",
                  text: `Prerecorded interview uploaded: ${file.name}. Duration: ${durationMinutes}. Generate a role-readiness report using the resume analysis, target role, and uploaded interview evidence. The video is available locally for candidate review, while the report should focus on role fit, likely interview signals, preparation gaps, and next actions.`,
                },
              ],
              scores: {
                technical: Math.max(
                  58,
                  resumeAnalysis.bestFitRoles?.[0]?.confidence || 65,
                ),
                communication: durationSeconds > 90 ? 72 : 62,
                confidence: durationSeconds > 90 ? 70 : 60,
                engagement: durationSeconds > 90 ? 74 : 64,
              },
              audioVideoSignals: {
                source: "uploaded-recording",
                durationSeconds,
                confidence: durationSeconds > 90 ? 70 : 60,
                engagement: durationSeconds > 90 ? 74 : 64,

      // ─── ROOT APP ─────────────────────────────────────────────────────────────────

      function App() {
        const [screen, setScreen] = useState("auth");
        const [isLight, setIsLight] = useState(false);
        const [user, setUser] = useState(appUser);
        useEffect(() => {
          document.body.classList.toggle("light", isLight);
          document.body.classList.add("theme-transition");
        }, [isLight]);
        useEffect(() => {
          const token = localStorage.getItem("roleready_token");
          if (!token) return;
          fetch("http://localhost:3001/api/auth/me", {
            headers: { Authorization: `Bearer ${token}` },
          })
            .then((r) => (r.ok ? r.json() : null))
            .then((data) => {
              if (data?.user) {
                appUser = data.user;
                setUser(data.user);
                setScreen("dashboard");
              }
            })
            .catch(() => {});
        }, []);
        const navigate = (s) => setScreen(s);
        const handleAuth = (u) => {
          appUser = u;
          setUser(u);
          navigate("dashboard");
        };
        const handleLogout = async () => {
          const token = localStorage.getItem("roleready_token");
          localStorage.removeItem("roleready_token");
          if (token) {
            fetch("http://localhost:3001/api/auth/logout", {
              method: "POST",
              headers: { Authorization: `Bearer ${token}` },
            }).catch(() => {});
          }
          appUser = {
            name: "User",
            email: "",
            provider: "email",
          };
          setUser(appUser);
          navigate("auth");
        };
        const screens = {
          auth: <AuthScreen onAuth={handleAuth} />,
          dashboard: (
            <DashboardScreen
              navigate={navigate}
              onLogout={handleLogout}
              user={user}
            />
          ),
          analysis: (
            <AnalysisScreen
              navigate={navigate}
              onLogout={handleLogout}
              user={user}
            />
          ),
          jobs: (
            <JobsScreen
              navigate={navigate}
              onLogout={handleLogout}
              user={user}
            />
          ),
          interview: (
            <InterviewScreen
              navigate={navigate}
              onLogout={handleLogout}
              user={user}
            />
          ),
          report: (
            <ReportScreen
              navigate={navigate}
              onLogout={handleLogout}
              user={user}
            />
          ),
        };
        return (
          <ThemeContext.Provider
            value={{ isLight, toggleTheme: () => setIsLight((v) => !v) }}
          >
            <ClickSpark
              sparkColor={isLight ? "#7C3AED" : "#FFFFFF"}
              sparkSize={10}
              sparkRadius={18}
              sparkCount={8}
              duration={420}
            >
              {screens[screen] || screens.auth}
            </ClickSpark>
          </ThemeContext.Provider>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
