<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RoleReady AI - Intelligent Mock Interview Platform</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
    <style>
      :root {
        --bg: #080a12;
        --surface: #0a0c16;
        --card: #0f1120;
        --panel: #0d0f1c;
        --border: #1a1f35;
        --text: #ffffff;
        --text-soft: #e2e8f0;
        --text-muted: #cbd5e1;
        --text-subtle: #64748b;
        --text-faint: #4a5568;
        --hero-grid: rgba(148, 163, 184, 0.28);
        --hero-glow-a: rgba(249, 115, 22, 0.28);
        --hero-glow-b: rgba(124, 58, 237, 0.24);
        --hero-glow-c: rgba(37, 99, 235, 0.26);
      }
      body.light {
        --bg: #f6f7fb;
        --surface: #ffffff;
        --card: #ffffff;
        --panel: #f8fafc;
        --border: #dde3ef;
        --text: #111827;
        --text-soft: #1f2937;
        --text-muted: #475569;
        --text-subtle: #64748b;
        --text-faint: #94a3b8;
        --hero-grid: rgba(15, 23, 42, 0.22);
        --hero-glow-a: rgba(249, 115, 22, 0.24);
        --hero-glow-b: rgba(124, 58, 237, 0.18);
        --hero-glow-c: rgba(37, 99, 235, 0.18);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "DM Sans", sans-serif;
      }
      .shapegrid-canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: none;
        display: block;
        z-index: 0;
        opacity: 0.42;
        pointer-events: none;
      }
      body.light .shapegrid-canvas {
        opacity: 0.28;
      }
      .infinite-grid-bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
        background: radial-gradient(
            ellipse 75% 36% at 50% 21%,
            rgba(124, 58, 237, 0.36) 0%,
            rgba(124, 58, 237, 0.21) 34%,
            rgba(255, 255, 255, 0.12) 42%,
            rgba(124, 58, 237, 0.06) 55%,
            transparent 72%
          ),
          linear-gradient(
            180deg,
            var(--bg) 0%,
            rgba(8, 10, 18, 0.86) 48%,
            var(--bg) 100%
          );
      }
      .infinite-grid-layer {
        position: absolute;
        inset: 0;
        color: var(--hero-grid);
      }
      .infinite-grid-layer.base {
        opacity: 0.1;
      }
      .infinite-grid-layer.active {
        opacity: 0.48;
      }
      .infinite-grid-vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(
            circle at 78% 12%,
            var(--hero-glow-a),
            transparent 24%
          ),
          radial-gradient(
            circle at 16% 78%,
            var(--hero-glow-c),
            transparent 28%
          ),
          radial-gradient(
            circle at 68% 52%,
            var(--hero-glow-b),
            transparent 30%
          ),
          linear-gradient(180deg, transparent 0%, rgba(0, 0, 0, 0.24) 100%);
        filter: blur(42px);
        opacity: 0.66;
      }
      body.light .infinite-grid-bg {
        background: radial-gradient(
            ellipse 76% 36% at 50% 18%,
            rgba(124, 58, 237, 0.2) 0%,
            rgba(124, 58, 237, 0.1) 40%,
            rgba(255, 255, 255, 0.38) 50%,
            transparent 72%
          ),
          linear-gradient(180deg, #f8fafc 0%, #eef2ff 45%, #f6f7fb 100%);
      }
      body.light .infinite-grid-layer.base {
        opacity: 0.13;
      }
      body.light .infinite-grid-layer.active {
        opacity: 0.34;
      }
      body.light .infinite-grid-vignette {
        opacity: 0.36;
      }
      .auth-hero-kicker {
        color: #a78bfa;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        margin-bottom: 10px;
      }
      .auth-landing {
        width: min(1160px, 100%);
        min-height: calc(100vh - 40px);
        border: 1px solid rgba(148, 163, 184, 0.2);
        background: rgba(3, 5, 12, 0.58);
        border-radius: 8px;
        overflow: hidden;
        backdrop-filter: blur(16px);
        box-shadow: 0 28px 110px rgba(2, 6, 23, 0.35);
      }
      body.light .auth-landing {
        background: rgba(255, 255, 255, 0.68);
        box-shadow: 0 28px 90px rgba(79, 70, 229, 0.14);
      }
      .auth-topbar {
        height: 70px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 42px;
        position: relative;
        z-index: 3;
      }
      .auth-brand {
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 0;
      }
      .auth-brand-button {
        border: none;
        background: transparent;
        color: var(--text);
        cursor: pointer;
        padding: 0;
      }
      .auth-links {
        display: flex;
        align-items: center;
        gap: 22px;
        color: var(--text-subtle);
        font-size: 13px;
        font-weight: 700;
      }
      .auth-link {
        border: none;
        background: transparent;
        color: inherit;
        cursor: pointer;
        padding: 0;
        font-weight: 700;
      }
      .auth-hero {
        position: relative;
        min-height: 560px;
        padding: 74px 28px 26px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .auth-arc {
        position: absolute;
        left: 50%;
        top: 36px;
        width: min(980px, 98vw);
        height: 420px;
        transform: translateX(-50%);
        border-radius: 50% 50% 0 0;
        background: radial-gradient(
          ellipse at center bottom,
          rgba(124, 58, 237, 0.82) 0%,
          rgba(124, 58, 237, 0.58) 28%,
          rgba(255, 255, 255, 0.78) 38%,
          rgba(124, 58, 237, 0.34) 48%,
          transparent 69%
        );
        filter: blur(16px);
        opacity: 0.9;
        pointer-events: none;
      }
      body.light .auth-arc {
        opacity: 0.46;
      }
      .auth-hero-content {
        position: relative;
        z-index: 2;
        max-width: 780px;
        margin: 0 auto;
      }
      .auth-hero h1 {
        margin: 0;
        font-size: clamp(46px, 7vw, 82px);
        line-height: 0.96;
        letter-spacing: 0;
        text-wrap: balance;
      }
      .auth-hero p {
        margin: 18px auto 0;
        max-width: 640px;
        color: var(--text-muted);
        line-height: 1.7;
        font-size: 16px;
      }
      .auth-actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 26px;
      }
      .auth-proof {
        position: relative;
        z-index: 2;
        margin-top: 54px;
        width: min(780px, 100%);
        display: grid;
        grid-template-columns: 1.1fr 1fr 1fr 1fr;
        gap: 0;
        border: 1px solid rgba(148, 163, 184, 0.28);
        border-radius: 8px;
        background: rgba(10, 12, 22, 0.72);
        backdrop-filter: blur(12px);
      }
      body.light .auth-proof {
        background: rgba(255, 255, 255, 0.72);
      }
      .auth-proof-item {
        padding: 16px 18px;
        border-right: 1px solid rgba(148, 163, 184, 0.22);
        text-align: left;
      }
      .auth-proof-item:last-child {
        border-right: none;
      }
      .auth-proof-label {
        color: var(--text-subtle);
        font-size: 11px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }
      .auth-proof-value {
        margin-top: 4px;
        font-size: 18px;
        font-weight: 900;
      }
      .auth-sections {
        padding: 26px 44px 44px;
      }
      .auth-section-heading {
        text-align: center;
        margin: 8px auto 24px;
        max-width: 620px;
      }
      .auth-section-heading h2 {
        margin: 0;
        font-size: 28px;
        letter-spacing: 0;
      }
      .auth-section-heading p {
        color: var(--text-subtle);
        line-height: 1.6;
        margin: 10px 0 0;
      }
      .auth-feature-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }
      .auth-feature-card {
        min-height: 152px;
        border-radius: 8px !important;
        background: rgba(15, 17, 32, 0.68) !important;
      }
      body.light .auth-feature-card {
        background: rgba(255, 255, 255, 0.78) !important;
      }
      .auth-feature-card.featured {
        background: linear-gradient(135deg, #7c3aed, #4c1d95) !important;
        color: #ffffff;
      }
      .auth-signin-row {
        display: grid;
        grid-template-columns: 1fr 420px;
        gap: 16px;
        align-items: stretch;
        margin-top: 16px;
      }
      .auth-process {
        border-radius: 8px;
        border: 1px solid rgba(124, 58, 237, 0.28);
        padding: 24px;
        background: linear-gradient(
          135deg,
          rgba(124, 58, 237, 0.42),
          rgba(15, 17, 32, 0.72)
        );
      }
      body.light .auth-process {
        background: linear-gradient(
          135deg,
          rgba(124, 58, 237, 0.16),
          rgba(255, 255, 255, 0.78)
        );
      }
      .auth-form-card {
        border-radius: 8px !important;
        background: rgba(10, 12, 22, 0.82) !important;
        backdrop-filter: blur(14px);
      }
      body.light .auth-form-card {
        background: rgba(255, 255, 255, 0.86) !important;
      }
      @media (max-width: 900px) {
        .auth-topbar {
          padding: 0 18px;
        }
        .auth-links {
          display: none;
        }
        .auth-hero {
          min-height: 520px;
          padding-top: 54px;
        }
        .auth-proof,
        .auth-feature-grid,
        .auth-signin-row {
          grid-template-columns: 1fr;
        }
        .auth-proof-item {
          border-right: none;
          border-bottom: 1px solid rgba(148, 163, 184, 0.22);
        }
        .auth-proof-item:last-child {
          border-bottom: none;
        }
        .auth-sections {
          padding: 22px 18px 28px;
        }
      }
      button,
      input,
      textarea {
        font-family: "DM Sans", sans-serif;
      }
      button {
        transition: all 0.15s ease;
      }
      button:hover {
        opacity: 0.92;
        transform: translateY(-1px);
      }
      input:focus,
      textarea:focus {
        border-color: #7c3aed !important;
        box-shadow: 0 0 0 2px rgba(124, 58, 237, 0.14);
      }
      ::-webkit-scrollbar {
        width: 5px;
      }
      ::-webkit-scrollbar-thumb {
        background: #2d3748;
        border-radius: 3px;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }
      @keyframes bounce {
        0%,
        80%,
        100% {
          transform: scale(0);
        }
        40% {
          transform: scale(1);
        }
      }
      @media print {
        body {
          background: #ffffff !important;
        }
        body * {
          visibility: hidden;
        }
        .report-print-area,
        .report-print-area * {
          visibility: visible;
        }
        .report-print-area {
          position: absolute !important;
          inset: 0 auto auto 0 !important;
          width: 100% !important;
          padding: 18px !important;
        }
        .no-print,
        .no-print * {
          display: none !important;
        }
        video {
          display: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useEffect, useMemo, useRef, useState } = React;

      let appUser = { name: "User", email: "", provider: "email" };
      let resumeState = { uploaded: false, fileName: "", parseInfo: null };
      let candidate = {
        name: "Resume Candidate",
        email: "",
        targetRoles: ["Upload a resume to infer roles"],
        skills: [],
        weakAreas: [],
        projects: [],
        experienceLevel: "Not analyzed",
        totalExperience: "Upload resume",
      };
      let resumeAnalysis = {
        extractedSkills: [],
        bestFitRoles: [],
        interviewFocusAreas: [],
        weakMissingAreas: [],
      };
      let currentJobRecommendations = [];
      let jobRecommendationSource = "";
      let generatedReport = null;
      let lastInterviewSession = null;
      let lastInterviewRecordingUrl = null;

      const api = (path) => `http://localhost:3001${path}`;
      const clampScore = (value) =>
        Math.max(0, Math.min(100, Math.round(Number(value) || 0)));
      const initials = (name) =>
        String(name || "User")
          .split(/\s+/)
          .filter(Boolean)
          .slice(0, 2)
          .map((part) => part[0]?.toUpperCase())
          .join("") || "U";
      const scoreColor = (s) =>
        s >= 80 ? "#10B981" : s >= 65 ? "#F59E0B" : "#EF4444";
      const priColor = (p) =>
        p === "High" ? "#10B981" : p === "Medium" ? "#F59E0B" : "#94A3B8";
      const escapeHtml = (value) =>
        String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");

      function resetResume() {
        resumeState = { uploaded: false, fileName: "", parseInfo: null };
        candidate = {
          name: "Resume Candidate",
          email: "",
          targetRoles: ["Upload a resume to infer roles"],
          skills: [],
          weakAreas: [],
          projects: [],
          experienceLevel: "Not analyzed",
          totalExperience: "Upload resume",
        };
        resumeAnalysis = {
          extractedSkills: [],
          bestFitRoles: [],
          interviewFocusAreas: [],
          weakMissingAreas: [],
        };
        currentJobRecommendations = [];
        jobRecommendationSource = "";
        generatedReport = null;
        lastInterviewSession = null;
        if (lastInterviewRecordingUrl)
          URL.revokeObjectURL(lastInterviewRecordingUrl);
        lastInterviewRecordingUrl = null;
      }

      async function postJson(path, payload) {
        const res = await fetch(api(path), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (!res.ok || data.ok === false)
          throw new Error(data.error || "Request failed");
        return data;
      }

      async function uploadResume(file) {
        const fd = new FormData();
        fd.append("resume", file);
        const res = await fetch(api("/api/analyze-resume"), {
          method: "POST",
          body: fd,
        });
        const data = await res.json();
        if (!res.ok || !data.ok)
          throw new Error(data.error || "Resume analysis failed");
        return data;
      }

      function buildUiFallbackJobs() {
        const roles = resumeAnalysis.bestFitRoles?.length
          ? resumeAnalysis.bestFitRoles
          : [{ role: "Target Role", confidence: 65 }];
        const skills = (resumeAnalysis.extractedSkills || [])
          .map((skill) => skill.name)
          .filter(Boolean);
        return roles.slice(0, 4).map((role, index) => {
          const matchScore = clampScore(
            (role.confidence || 65) - index * 5 + Math.min(skills.length, 8),
          );
          const missing =
            resumeAnalysis.weakMissingAreas
              ?.slice(index, index + 2)
              .map((gap) => gap.area) || [];
          return {
            id: `resume-fit-${index + 1}`,
            title: role.role,
            company: "Resume-fit opportunity",
            location: index % 2 ? "Remote" : "Target market",
            type: /intern|trainee/i.test(role.role) ? "Internship" : "Role",
            salary: "Not listed",
            matchScore,
            matchingSkills: skills.slice(0, 5),
            missingSkills: missing,
            whyFits:
              role.reasoning ||
              `Matched from ${candidate.name || "the candidate"}'s parsed skills and project evidence.`,
            priority:
              matchScore >= 82 ? "High" : matchScore >= 68 ? "Medium" : "Low",
            postedDays: 0,
            logo: initials(role.role),
            logoColor: ["#7C3AED", "#2563EB", "#059669", "#D97706"][index % 4],
          };
        });
      }

      function buildUiFallbackReport(session) {
        const scores = session?.scores || {};
        const avg = clampScore(
          ((scores.technical || 60) +
            (scores.communication || 60) +
            (scores.confidence || 60) +
            (scores.engagement || 60)) /
            4,
        );
        const role =
          session?.targetRole ||
          resumeAnalysis.bestFitRoles?.[0]?.role ||
          "target role";
        const gaps = resumeAnalysis.weakMissingAreas?.length
          ? resumeAnalysis.weakMissingAreas.map((gap) => gap.area)
          : ["answer structure", "technical depth", "evidence and metrics"];
        return {
          source: "session-fallback-report",
          warning: "Generated locally from the captured interview session.",
          overallScore: avg,
          roleReadiness: clampScore(
            (scores.technical || avg) * 0.65 +
              (scores.communication || avg) * 0.35,
          ),
          technicalScore: clampScore(scores.technical || avg),
          communicationScore: clampScore(scores.communication || avg),
          confidenceScore: clampScore(scores.confidence || avg),
          engagementScore: clampScore(scores.engagement || avg),
          strengths: [
            `Completed an adaptive interview for ${role}`,
            "Transcript and score signals were captured for coaching",
            "Resume evidence was used to personalize the report",
          ],
          weaknesses: gaps.slice(0, 4).map((gap) => `Improve ${gap}`),
          questionFeedback: (session?.transcript || [])
            .filter((item) => item.role === "candidate")
            .slice(0, 5)
            .map((item, index) => ({
              question: `Adaptive turn ${index + 1}`,
              score: avg,
              feedback:
                "The answer was captured. Strengthen it with clearer context, tradeoffs, constraints, and measurable outcomes.",
              improvement: `For ${role}, answer with context, decision, tradeoff, result, and what you would improve next.`,
            })),
          prepPlan: Array.from({ length: 7 }, (_, index) => ({
            day: index + 1,
            focus: index === 0 ? role : gaps[index % gaps.length],
            tasks: [
              `Practice one ${role} answer with concrete evidence`,
              "Add metrics, constraints, and tradeoffs to the answer",
            ],
          })),
          coachingSummary: `${candidate.name || "The candidate"} completed a mock interview for ${role}. This backup report was generated from captured session scores and resume-derived gaps.`,
        };
      }

      const baseQuestions = [
        {
          question:
            "Walk me through the most relevant project from your resume. Explain the architecture, tradeoffs, and impact.",
          category: "Resume Deep-dive",
          difficulty: "Medium",
        },
        {
          question:
            "Design a role-relevant system for your target job. Start with requirements, data model, APIs, and scaling tradeoffs.",
          category: "System Design",
          difficulty: "Hard",
        },
        {
          question:
            "Pick one technical decision from your resume. What alternatives did you reject, and why?",
          category: "Tradeoffs",
          difficulty: "Medium",
        },
        {
          question:
            "Tell me about a technical challenge you faced and how you debugged or improved it.",
          category: "Behavioral",
          difficulty: "Easy",
        },
      ];

      function Btn({
        children,
        onClick,
        variant = "primary",
        disabled,
        style = {},
      }) {
        const base = {
          padding: "10px 18px",
          borderRadius: 10,
          fontWeight: 700,
          cursor: disabled ? "not-allowed" : "pointer",
          fontSize: 14,
          border: "none",
          opacity: disabled ? 0.5 : 1,
          ...style,
        };
        const variants = {
          primary: {
            ...base,
            background: "linear-gradient(135deg,#7C3AED,#6D28D9)",
            color: "white",
            boxShadow: "0 4px 20px rgba(124,58,237,0.25)",
          },
          secondary: {
            ...base,
            background: "rgba(124,58,237,0.1)",
            color: "#A78BFA",
            border: "1px solid rgba(124,58,237,0.3)",
          },
          ghost: {
            ...base,
            background: "transparent",
            color: "var(--text-muted)",
            border: "1px solid var(--border)",
          },
          danger: {
            ...base,
            background: "linear-gradient(135deg,#DC2626,#B91C1C)",
            color: "white",
          },
        };
        return (
          <button
            onClick={onClick}
            disabled={disabled}
            style={variants[variant]}
          >
            {children}
          </button>
        );
      }

      function Card({ children, style = {}, className = "", onClick }) {
        return (
          <div
            className={className}
            onClick={onClick}
            style={{
              background: "var(--card)",
              border: "1px solid var(--border)",
              borderRadius: 16,
              padding: 20,
              boxShadow: "0 16px 60px rgba(2,6,23,0.12)",
              ...style,
            }}
          >
            {children}
          </div>
        );
      }

      function Tag({ children, color = "#7C3AED" }) {
        return (
          <span
            style={{
              color,
              background: `${color}18`,
              border: `1px solid ${color}30`,
              padding: "3px 9px",
              borderRadius: 999,
              fontSize: 11,
              fontWeight: 700,
              whiteSpace: "nowrap",
            }}
          >
            {children}
          </span>
        );
      }

      function CircleScore({ score, label, size = 78, color }) {
        const stroke = 7;
        const r = (size - stroke * 2) / 2;
        const circ = 2 * Math.PI * r;
        const c = color || scoreColor(score);
        return (
          <div style={{ textAlign: "center" }}>
            <svg width={size} height={size}>
              <circle
                cx={size / 2}
                cy={size / 2}
                r={r}
                fill="none"
                stroke="var(--border)"
                strokeWidth={stroke}
              />
              <circle
                cx={size / 2}
                cy={size / 2}
                r={r}
                fill="none"
                stroke={c}
                strokeWidth={stroke}
                strokeDasharray={circ}
                strokeDashoffset={circ * (1 - clampScore(score) / 100)}
                strokeLinecap="round"
                transform={`rotate(-90 ${size / 2} ${size / 2})`}
              />
              <text
                x={size / 2}
                y={size / 2 + 5}
                textAnchor="middle"
                fill="var(--text)"
                fontSize="14"
                fontWeight="800"
              >
                {clampScore(score)}
              </text>
            </svg>
            {label && (
              <div style={{ color: "var(--text-subtle)", fontSize: 10 }}>
                {label}
              </div>
            )}
          </div>
        );
      }

      function DashboardScreen({ navigate, refresh }) {
        const [uploaded, setUploaded] = useState(resumeState.uploaded);
        const [uploading, setUploading] = useState(false);
        const [dragging, setDragging] = useState(false);
        const [error, setError] = useState("");
        const [parseInfo, setParseInfo] = useState(resumeState.parseInfo);

        const doUpload = async (file) => {
          if (!file) return;
          if (
            !/pdf|text|plain/i.test(file.type) &&
            !/\.(pdf|txt)$/i.test(file.name)
          ) {
            setError("Upload a PDF or TXT resume.");
            return;
          }
          setUploading(true);
          setError("");
          try {
            const data = await uploadResume(file);
            candidate = data.candidate;
            resumeAnalysis = data.analysis;
            resumeState = {
              uploaded: true,
              fileName: file.name,
              parseInfo: {
                source: data.source,
                textPreview: data.textPreview,
                warning: data.warning,
              },
            };
            generatedReport = null;
            lastInterviewSession = null;
            currentJobRecommendations = [];
            jobRecommendationSource = "";
            setUploaded(true);
            setParseInfo(resumeState.parseInfo);
            refresh();
          } catch (err) {
            setError(err.message || "Could not parse resume");
          } finally {
            setUploading(false);
          }
        };

        return (
          <Page navigate={navigate} active="dashboard">
            <div
              style={{
                display: "flex",
                justifyContent: "space-between",
                marginBottom: 22,
              }}
            >
              <div>
                <h1 style={{ margin: 0, fontSize: 26 }}>

                    ? `${candidate.name}'s readiness workspace`
                    : "Build your interview readiness profile"}

                <p style={{ color: "var(--text-subtle)", marginTop: 5 }}>
                  {resumeState.uploaded
                    ? "Resume parsed. Complete a mock interview to unlock readiness and gaps."
                    : "Upload your resume to unlock analysis, jobs, interviews, and reports."}

                onClick={() => navigate("interview")}
                disabled={!resumeState.uploaded}

            <div

                display: "grid",
                gridTemplateColumns: "1fr 1fr 1fr",
                gap: 16,

                <div style={{ fontWeight: 800, marginBottom: 14 }}>
                  🔒 Resume

                {!uploaded ? (
                  <>
                    <div
                      onDragOver={(e) => {
                        e.preventDefault();
                        setDragging(true);
                      }}
                      onDragLeave={() => setDragging(false)}
                      onDrop={(e) => {
                        e.preventDefault();
                        setDragging(false);
                        doUpload(e.dataTransfer?.files?.[0]);
                      }}
                      onClick={() =>
                        document.getElementById("resumeInput").click()

                      style={{
                        border: `2px dashed ${dragging ? "#7C3AED" : "var(--border)"}`,

                        padding: "26px 16px",

                        cursor: "pointer",
                        background: dragging
                          ? "rgba(124,58,237,0.08)"

                      }}

                      <input
                        id="resumeInput"
                        type="file"
                        accept=".pdf,.txt"
                        style={{ display: "none" }}
                        onChange={(e) => doUpload(e.target.files?.[0])}
                      />

      function InterviewScreen({ navigate, refresh }) {
        const inferredRole =
          resumeAnalysis.bestFitRoles?.[0]?.role ||
          candidate.targetRoles?.[0] ||
          "Software Engineer";
        const roleOptions = Array.from(
          new Set(
            [
              ...(resumeAnalysis.bestFitRoles || []).map((role) => role.role),
              ...(candidate.targetRoles || []),
              "Backend Developer",
              "Frontend Developer",
              "Full Stack Developer",
              "Software Engineer",
              "Data Analyst",
              "Data Scientist",
              "AI Engineer",
              "Machine Learning Engineer",
              "Data Engineer",
              "Business Analyst",
              "Product Manager",
              "DevOps Engineer",
              "Cloud Engineer",
              "Cybersecurity Analyst",
              "Mobile App Developer",
              "QA Automation Engineer",
              "UI/UX Designer",
            ].filter(Boolean),
          ),
        );
        const [phase, setPhase] = useState("ready");
        const [selectedRole, setSelectedRole] = useState(inferredRole);
        const [roleQuery, setRoleQuery] = useState(inferredRole);
        const [roleOpen, setRoleOpen] = useState(false);
        const [questionCount, setQuestionCount] = useState(5);
        const [qIdx, setQIdx] = useState(0);
        const [answer, setAnswer] = useState("");
        const [transcript, setTranscript] = useState([]);
        const [thinking, setThinking] = useState(false);
        const [elapsed, setElapsed] = useState(0);
        const [answered, setAnswered] = useState(0);
        const [difficulty, setDifficulty] = useState("Medium");
        const [category, setCategory] = useState("Resume Calibration");
        const [reasoning, setReasoning] = useState(
          "Ready to calibrate from the user's resume.",
        );
        const [currentQ, setCurrentQ] = useState(baseQuestions[0].question);
        const [scores, setScores] = useState({
          technical: 58,
          communication: 63,
          confidence: 60,
          engagement: 68,
        });
        const [avEnabled, setAvEnabled] = useState(false);
        const [avError, setAvError] = useState("");
        const [recordingState, setRecordingState] = useState("idle");
        const [recordingUrl, setRecordingUrl] = useState(
          lastInterviewRecordingUrl,
        );
        const [avMetrics, setAvMetrics] = useState({
          audioLevel: 0,
          speaking: false,
          pauseCount: 0,
          clarity: 62,
          confidence: 60,
          facePresent: false,
          eyeContact: 58,
          posture: 62,
          engagement: 64,
          stress: 32,
          source: "waiting",
        });
        const videoRef = useRef(null);
        const streamRef = useRef(null);
        const recorderRef = useRef(null);
        const chunksRef = useRef([]);
        const analyserRef = useRef(null);
        const audioCtxRef = useRef(null);
        const intervalRef = useRef(null);
        const totalQuestions = Math.max(5, Number(questionCount) || 5);
        const targetRole = selectedRole.trim() || inferredRole;
        const roleSuggestions = roleOptions
          .filter((role) =>
            role.toLowerCase().includes(roleQuery.trim().toLowerCase()),
          )
          .slice(0, 7);

        useEffect(() => {
          if (phase !== "active") return;
          const timer = setInterval(() => setElapsed((v) => v + 1), 1000);
          return () => clearInterval(timer);
        }, [phase]);
        useEffect(() => () => stopAV(), []);

        const fmt = (s) =>
          `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;

        const startRecording = (stream) => {
          if (!window.MediaRecorder) {
            setRecordingState("unavailable");
            return;
          }
          try {
            chunksRef.current = [];
            const recorder = new MediaRecorder(stream);
            recorder.ondataavailable = (event) => {
              if (event.data?.size) chunksRef.current.push(event.data);
            };
            recorder.onstop = () => {
              if (!chunksRef.current.length)
                return setRecordingState("unavailable");
              if (lastInterviewRecordingUrl)
                URL.revokeObjectURL(lastInterviewRecordingUrl);
              const blob = new Blob(chunksRef.current, { type: "video/webm" });
              lastInterviewRecordingUrl = URL.createObjectURL(blob);
              setRecordingUrl(lastInterviewRecordingUrl);
              setRecordingState("saved");
            };
            recorderRef.current = recorder;
            recorder.start(1000);
            setRecordingState("recording");
          } catch (err) {
            setRecordingState("unavailable");
          }
        };

        const stopAV = () => {
          if (intervalRef.current) clearInterval(intervalRef.current);
          intervalRef.current = null;
          if (recorderRef.current && recorderRef.current.state !== "inactive") {
            try {
              recorderRef.current.stop();
            } catch {}
          }
          recorderRef.current = null;
          if (streamRef.current)
            streamRef.current.getTracks().forEach((track) => track.stop());
          streamRef.current = null;
          if (audioCtxRef.current) audioCtxRef.current.close().catch(() => {});
          audioCtxRef.current = null;
          analyserRef.current = null;
          setAvEnabled(false);
        };

        const startAV = async () => {
          if (streamRef.current) return;
          if (!navigator.mediaDevices?.getUserMedia) {
            setAvError("This browser does not expose camera/mic analysis.");
            return;
          }
          try {
            setAvError("Requesting camera and microphone permission...");
            const stream = await navigator.mediaDevices.getUserMedia({
              video: true,
              audio: { echoCancellation: true, noiseSuppression: true },
            });
            streamRef.current = stream;
            setAvEnabled(true);
            setAvError("");
            if (videoRef.current) {
              videoRef.current.srcObject = stream;
              videoRef.current.play().catch(() => {});
            }
            startRecording(stream);
            const AudioContext =
              window.AudioContext || window.webkitAudioContext;
            if (AudioContext) {
              const ctx = new AudioContext();
              const source = ctx.createMediaStreamSource(stream);
              const analyser = ctx.createAnalyser();
              analyser.fftSize = 1024;
              source.connect(analyser);
              audioCtxRef.current = ctx;
              analyserRef.current = analyser;
            }
            let silence = 0;
            let lastSpeaking = false;
            intervalRef.current = setInterval(() => {
              const analyser = analyserRef.current;
              let audioLevel = 0;
              if (analyser) {
                const data = new Uint8Array(analyser.fftSize);
                analyser.getByteTimeDomainData(data);
                let sum = 0;
                for (const point of data) {
                  const normalized = (point - 128) / 128;
                  sum += normalized * normalized;
                }
                audioLevel = clampScore(Math.sqrt(sum / data.length) * 240);
              }
              const speaking = audioLevel > 8;
              setAvMetrics((prev) => {
                let pauseCount = prev.pauseCount;
                if (speaking && !lastSpeaking && silence > 3) pauseCount += 1;
                silence = speaking ? 0 : silence + 1;
                lastSpeaking = speaking;
                const clarity = clampScore(
                  speaking ? 62 + audioLevel * 0.45 : prev.clarity * 0.96,
                );
                const confidence = clampScore(
                  clarity * 0.5 + prev.eyeContact * 0.25 + prev.posture * 0.25,
                );
                const next = {
                  ...prev,
                  audioLevel,
                  speaking,
                  pauseCount,
                  clarity,
                  confidence,
                  facePresent: avEnabled,
                  eyeContact: avEnabled ? 68 : 0,
                  posture: avEnabled ? 70 : 0,
                  engagement: clampScore(confidence + (speaking ? 8 : 0)),
                  stress: clampScore(
                    105 - confidence + (pauseCount > 5 ? 8 : 0),
                  ),
                  source: "browser-live-analysis",
                };
                setScores((s) => ({
                  ...s,
                  communication: clampScore(
                    s.communication * 0.86 + clarity * 0.14,
                  ),
                  confidence: clampScore(
                    s.confidence * 0.84 + confidence * 0.16,
                  ),
                  engagement: clampScore(
                    s.engagement * 0.84 + next.engagement * 0.16,
                  ),
                }));
                return next;
              });
            }, 700);
          } catch (err) {
            setAvError(
              `Camera/mic did not start: ${err.name || "Permission/device error"}. Check browser permission, close other apps using the camera, then press Enable camera/mic.`,
            );
            setRecordingState("unavailable");
          }
        };

        const startInterview = async () => {
          setPhase("active");
          setElapsed(0);
          setAnswered(0);
          setTranscript([]);
          setQIdx(0);
          setThinking(true);
          setTimeout(startAV, 150);
          try {
            const data = await postJson("/api/interview-turn", {
              resumeAnalysis,
              targetRole,
              questionCount: totalQuestions,
              difficulty: "Medium",
              answer: "",
              currentQuestion: "",
              transcript: [],
              answered: 0,
            });
            const turn = data.turn;
            setCurrentQ(turn.nextQuestion);
            setDifficulty(turn.difficulty || "Medium");
            setCategory(turn.category || "Resume Deep-dive");
            setReasoning(
              turn.reasoning ||
                "The agent calibrated the first question from resume evidence.",
            );
            setTranscript([{ role: "ai", text: turn.nextQuestion }]);
          } catch {
            const q = `Your resume points toward ${targetRole}. Walk me through the strongest project or experience that proves you are ready for this role.`;
            setCurrentQ(q);
            setTranscript([{ role: "ai", text: q }]);
            setReasoning(
              "Local interviewer started from the selected role and resume profile.",
            );
          } finally {
            setThinking(false);
          }
        };

        const submitAnswer = async () => {
          if (!answer.trim() || thinking) return;
          const submitted = answer.trim();
          const nextTranscript = [
            ...transcript,
            { role: "candidate", text: submitted },
          ];
          setTranscript(nextTranscript);
          setAnswer("");
          setAnswered((a) => a + 1);
          setThinking(true);
          try {
            const data = await postJson("/api/interview-turn", {
              resumeAnalysis,
              targetRole,
              questionCount: totalQuestions,
              difficulty,
              answer: submitted,
              currentQuestion: currentQ,
              transcript: nextTranscript.slice(-8),
              answered: answered + 1,
              scores,
            });
            const turn = data.turn;
            if (turn.scores) {
              setScores({
                technical: clampScore(
                  turn.scores.technical ?? scores.technical,
                ),
                communication: clampScore(
                  turn.scores.communication ?? scores.communication,
                ),
                confidence: clampScore(
                  turn.scores.confidence ?? scores.confidence,
                ),
                engagement: clampScore(
                  turn.scores.engagement ?? scores.engagement,
                ),
              });
            }
            setDifficulty(turn.difficulty || difficulty);
            setCategory(turn.category || "Adaptive Follow-up");
            setReasoning(
              turn.reasoning ||
                "The agent selected the next question from your answer and resume gaps.",
            );
            const done = answered + 1 >= totalQuestions;
            const nq = done
              ? "Great session. End the interview to generate your coaching report."
              : turn.nextQuestion;
            setCurrentQ(nq);
            setTranscript((t) => [...t, { role: "ai", text: nq }]);
            setQIdx((i) => Math.min(totalQuestions - 1, i + 1));
          } catch {
            const done = answered + 1 >= totalQuestions;
            const fallback = done
              ? "Great session. End the interview to generate your coaching report."
              : baseQuestions[(qIdx + 1) % baseQuestions.length].question;
            setCurrentQ(fallback);
            setTranscript((t) => [...t, { role: "ai", text: fallback }]);
            setQIdx((i) => Math.min(totalQuestions - 1, i + 1));
          } finally {
            setThinking(false);
          }
        };

        const finishInterview = async () => {
          const session = {
            candidate,
            resumeAnalysis,
            targetRole,
            questionCount: totalQuestions,
            transcript,
            scores,
            durationSeconds: elapsed,
            answered,
            audioVideoSignals: avMetrics,
            recordingAvailable:
              recordingState === "saved" || recordingState === "recording",
            lastReasoning: reasoning,
          };
          lastInterviewSession = session;
          try {
            const data = await postJson("/api/generate-report", session);
            generatedReport = data.report;
          } catch (err) {
            generatedReport = {
              ...buildUiFallbackReport(session),
              warning: err.message,
            };
          }
          stopAV();
          setPhase("ended");
          refresh();
        };

        const readDuration = (file) =>
          new Promise((resolve) => {
            const url = URL.createObjectURL(file);
            const media = document.createElement(
              file.type.startsWith("audio/") ? "audio" : "video",
            );
            const finish = (value = 0) => {
              URL.revokeObjectURL(url);
              resolve(Number.isFinite(value) ? Math.round(value) : 0);
            };
            media.onloadedmetadata = () => finish(media.duration);
            media.onerror = () => finish(0);
            media.src = url;
            setTimeout(() => finish(0), 3000);
          });

        const uploadRecording = async (file) => {
          if (!file) return;
          if (
            !file.type.startsWith("video/") &&
            !file.type.startsWith("audio/")
          )
            return;
          const durationSeconds = await readDuration(file);
          if (lastInterviewRecordingUrl)
            URL.revokeObjectURL(lastInterviewRecordingUrl);
          lastInterviewRecordingUrl = URL.createObjectURL(file);
          setRecordingUrl(lastInterviewRecordingUrl);
          const session = {
            candidate,
            resumeAnalysis,
            targetRole,
            questionCount: totalQuestions,
            durationSeconds,
            answered: 1,
            transcript: [
              {
                role: "ai",
                text: `Evaluate this prerecorded interview for ${targetRole}.`,
              },
              {
                role: "candidate",
                text: `Prerecorded interview uploaded: ${file.name}. Generate a role-readiness report using the resume analysis, target role, and recording metadata.`,
              },
            ],
            scores: {
              technical: Math.max(
                58,
                resumeAnalysis.bestFitRoles?.[0]?.confidence || 65,
              ),
              communication: durationSeconds > 90 ? 72 : 62,
              confidence: durationSeconds > 90 ? 70 : 60,
              engagement: durationSeconds > 90 ? 74 : 64,
            },
            audioVideoSignals: {
              source: "uploaded-recording",
              durationSeconds,
            },
            uploadedRecording: {
              name: file.name,
              type: file.type,
              size: file.size,
              durationSeconds,
            },
          };
          lastInterviewSession = session;
          try {
            const data = await postJson("/api/generate-report", session);
            generatedReport = data.report;
          } catch {
            generatedReport = buildUiFallbackReport(session);
          }
          refresh();
          navigate("report");
        };

        if (!resumeState.uploaded) {
          return (
            <Page navigate={navigate} active="interview">
              <LockedCard
                title="Adaptive interview locked"
                body="Upload your resume first so the interviewer can ask role-specific questions."
                action="Upload Resume"
                onAction={() => navigate("dashboard")}
              />
            </Page>
          );
        }

        if (phase === "ready") {
          return (
            <Page navigate={navigate} active="interview">
              <Card style={{ maxWidth: 720, margin: "40px auto" }}>
                <h1 style={{ textAlign: "center" }}>
                  Ready for your interview?
                </h1>
                <p
                  style={{
                    color: "var(--text-subtle)",
                    textAlign: "center",
                    lineHeight: 1.6,
                  }}
                >
                  The interviewer adapts to your resume, selected role, answer
                  quality, and live audio/video signals.
                </p>
                <div
                  style={{
                    display: "grid",
                    gridTemplateColumns: "1fr 220px",
                    gap: 12,
                    marginTop: 24,
                  }}
                >
                  <div style={{ position: "relative" }}>
                    <label
                      style={{ color: "var(--text-subtle)", fontSize: 12 }}
                    >
                      Target Role
                    </label>
                    <input
                      value={roleQuery}
                      onFocus={() => setRoleOpen(true)}
                      onBlur={() => setTimeout(() => setRoleOpen(false), 120)}
                      onChange={(e) => {
                        setRoleQuery(e.target.value);
                        setSelectedRole(e.target.value);
                        setRoleOpen(true);
                      }}
                      placeholder="Start typing a role..."
                      style={{
                        width: "100%",
                        marginTop: 6,
                        background: "var(--surface)",
                        border: "1px solid var(--border)",
                        borderRadius: 10,
                        padding: "12px 14px",
                        color: "var(--text)",
                        outline: "none",
                      }}
                    />
                    {roleOpen && roleSuggestions.length > 0 && (
                      <div
                        style={{
                          position: "absolute",
                          left: 0,
                          right: 0,
                          top: 68,
                          zIndex: 20,
                          background: "var(--surface)",
                          border: "1px solid var(--border)",
                          borderRadius: 12,
                          padding: 6,
                        }}
                      >
                        {roleSuggestions.map((role) => (
                          <button
                            key={role}
                            onMouseDown={(e) => {
                              e.preventDefault();
                              setSelectedRole(role);
                              setRoleQuery(role);
                              setRoleOpen(false);
                            }}
                            style={{
                              width: "100%",
                              textAlign: "left",
                              border: "none",
                              background:
                                role === targetRole
                                  ? "rgba(124,58,237,0.16)"
                                  : "transparent",
                              color: "var(--text-soft)",
                              borderRadius: 8,
                              padding: "9px 10px",
                              cursor: "pointer",
                            }}
                          >
                            {role}
                          </button>
                        ))}
                      </div>
                    )}
                  </div>
                  <div>
                    <label
                      style={{ color: "var(--text-subtle)", fontSize: 12 }}
                    >
                      Questions
                    </label>
                    <div
                      style={{
                        display: "flex",
                        gap: 8,
                        alignItems: "center",
                        marginTop: 6,
                        background: "var(--surface)",
                        border: "1px solid var(--border)",
                        borderRadius: 10,
                        padding: 6,
                      }}
                    >
                      <Btn

      function ShapeGrid({
        direction = "diagonal",
        speed = 0.5,
        borderColor = "#2F293A",
        squareSize = 41,
        hoverFillColor = "#222",
        hoverColor = "#7C3AED",
        shape = "square",
        hoverTrailAmount = 15,
        className = "",
      }) {
        const canvasRef = useRef(null);
        const requestRef = useRef(null);
        const gridOffset = useRef({ x: 0, y: 0 });
        const hoveredSquare = useRef(null);
        const trailCells = useRef([]);
        const cellOpacities = useRef(new Map());

        useEffect(() => {
          const canvas = canvasRef.current;
          const ctx = canvas.getContext("2d");
          const isHex = shape === "hexagon";
          const isTri = shape === "triangle";
          const hexHoriz = squareSize * 1.5;
          const hexVert = squareSize * Math.sqrt(3);

          const resizeCanvas = () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
          };

          const drawHex = (cx, cy, size) => {
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
              const angle = (Math.PI / 3) * i;
              const vx = cx + size * Math.cos(angle);
              const vy = cy + size * Math.sin(angle);
              if (i === 0) ctx.moveTo(vx, vy);
              else ctx.lineTo(vx, vy);
            }
            ctx.closePath();
          };

          const drawCircle = (cx, cy, size) => {
            ctx.beginPath();
            ctx.arc(cx, cy, size / 2, 0, Math.PI * 2);
            ctx.closePath();
          };

          const drawTriangle = (cx, cy, size, flip) => {
            ctx.beginPath();
            if (flip) {
              ctx.moveTo(cx, cy + size / 2);
              ctx.lineTo(cx + size / 2, cy - size / 2);
              ctx.lineTo(cx - size / 2, cy - size / 2);
            } else {
              ctx.moveTo(cx, cy - size / 2);
              ctx.lineTo(cx + size / 2, cy + size / 2);
              ctx.lineTo(cx - size / 2, cy + size / 2);
            }
            ctx.closePath();
          };

          const updateCellOpacities = () => {
            const targets = new Map();
            if (hoveredSquare.current) {
              targets.set(
                `${hoveredSquare.current.x},${hoveredSquare.current.y}`,
                1,
              );
            }
            if (hoverTrailAmount > 0) {
              for (let i = 0; i < trailCells.current.length; i++) {
                const t = trailCells.current[i];
                const key = `${t.x},${t.y}`;
                if (!targets.has(key)) {
                  targets.set(
                    key,
                    (trailCells.current.length - i) /
                      (trailCells.current.length + 1),
                  );
                }
              }
            }
            for (const [key] of targets) {
              if (!cellOpacities.current.has(key))
                cellOpacities.current.set(key, 0);
            }
            for (const [key, opacity] of cellOpacities.current) {
              const target = targets.get(key) || 0;
              const next = opacity + (target - opacity) * 0.15;
              if (next < 0.005) cellOpacities.current.delete(key);
              else cellOpacities.current.set(key, next);
            }
          };

          const drawGrid = () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (isHex) {
              const colShift = Math.floor(gridOffset.current.x / hexHoriz);
              const offsetX =
                ((gridOffset.current.x % hexHoriz) + hexHoriz) % hexHoriz;
              const offsetY =
                ((gridOffset.current.y % hexVert) + hexVert) % hexVert;
              const cols = Math.ceil(canvas.width / hexHoriz) + 3;
              const rows = Math.ceil(canvas.height / hexVert) + 3;

              for (let col = -2; col < cols; col++) {
                for (let row = -2; row < rows; row++) {
                  const cx = col * hexHoriz + offsetX;
                  const cy =
                    row * hexVert +
                    ((col + colShift) % 2 !== 0 ? hexVert / 2 : 0) +
                    offsetY;
                  const alpha = cellOpacities.current.get(`${col},${row}`);
                  if (alpha) {
                    ctx.globalAlpha = alpha;
                    drawHex(cx, cy, squareSize);
                    ctx.fillStyle = hoverColor || hoverFillColor;
                    ctx.fill();
                    ctx.globalAlpha = 1;
                  }
                  drawHex(cx, cy, squareSize);
                  ctx.strokeStyle = borderColor;
                  ctx.stroke();
                }
              }
            } else if (isTri) {
              const halfW = squareSize / 2;
              const colShift = Math.floor(gridOffset.current.x / halfW);
              const rowShift = Math.floor(gridOffset.current.y / squareSize);
              const offsetX = ((gridOffset.current.x % halfW) + halfW) % halfW;
              const offsetY =
                ((gridOffset.current.y % squareSize) + squareSize) % squareSize;
              const cols = Math.ceil(canvas.width / halfW) + 4;
              const rows = Math.ceil(canvas.height / squareSize) + 4;

              for (let col = -2; col < cols; col++) {
                for (let row = -2; row < rows; row++) {
                  const cx = col * halfW + offsetX;
                  const cy = row * squareSize + squareSize / 2 + offsetY;
                  const flip =
                    (((col + colShift + row + rowShift) % 2) + 2) % 2 !== 0;
                  const alpha = cellOpacities.current.get(`${col},${row}`);
                  if (alpha) {
                    ctx.globalAlpha = alpha;
                    drawTriangle(cx, cy, squareSize, flip);
                    ctx.fillStyle = hoverColor || hoverFillColor;
                    ctx.fill();
                    ctx.globalAlpha = 1;
                  }
                  drawTriangle(cx, cy, squareSize, flip);
                  ctx.strokeStyle = borderColor;
                  ctx.stroke();
                }
              }
            } else if (shape === "circle") {
              const offsetX =
                ((gridOffset.current.x % squareSize) + squareSize) % squareSize;
              const offsetY =
                ((gridOffset.current.y % squareSize) + squareSize) % squareSize;
              const cols = Math.ceil(canvas.width / squareSize) + 3;
              const rows = Math.ceil(canvas.height / squareSize) + 3;

              for (let col = -2; col < cols; col++) {
                for (let row = -2; row < rows; row++) {
                  const cx = col * squareSize + squareSize / 2 + offsetX;
                  const cy = row * squareSize + squareSize / 2 + offsetY;
                  const alpha = cellOpacities.current.get(`${col},${row}`);
                  if (alpha) {
                    ctx.globalAlpha = alpha;
                    drawCircle(cx, cy, squareSize);
                    ctx.fillStyle = hoverColor || hoverFillColor;
                    ctx.fill();
                    ctx.globalAlpha = 1;
                  }
                  drawCircle(cx, cy, squareSize);
                  ctx.strokeStyle = borderColor;
                  ctx.stroke();
                }
              }
            } else {
              const offsetX =
                ((gridOffset.current.x % squareSize) + squareSize) % squareSize;
              const offsetY =
                ((gridOffset.current.y % squareSize) + squareSize) % squareSize;
              const cols = Math.ceil(canvas.width / squareSize) + 3;
              const rows = Math.ceil(canvas.height / squareSize) + 3;

              for (let col = -2; col < cols; col++) {
                for (let row = -2; row < rows; row++) {
                  const sx = col * squareSize + offsetX;
                  const sy = row * squareSize + offsetY;
                  const alpha = cellOpacities.current.get(`${col},${row}`);
                  if (alpha) {
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = hoverColor || hoverFillColor;
                    ctx.fillRect(sx, sy, squareSize, squareSize);
                    ctx.globalAlpha = 1;
                  }
                  ctx.strokeStyle = borderColor;
                  ctx.strokeRect(sx, sy, squareSize, squareSize);
                }
              }
            }
          };

          const updateAnimation = () => {
            const effectiveSpeed = Math.max(speed, 0.1);
            const wrapX = isHex ? hexHoriz * 2 : squareSize;
            const wrapY = isHex ? hexVert : isTri ? squareSize * 2 : squareSize;
            if (direction === "right")
              gridOffset.current.x =
                (gridOffset.current.x - effectiveSpeed + wrapX) % wrapX;
            else if (direction === "left")
              gridOffset.current.x =
                (gridOffset.current.x + effectiveSpeed + wrapX) % wrapX;
            else if (direction === "up")
              gridOffset.current.y =
                (gridOffset.current.y + effectiveSpeed + wrapY) % wrapY;
            else if (direction === "down")
              gridOffset.current.y =
                (gridOffset.current.y - effectiveSpeed + wrapY) % wrapY;
            else if (direction === "diagonal") {
              gridOffset.current.x =
                (gridOffset.current.x - effectiveSpeed + wrapX) % wrapX;
              gridOffset.current.y =
                (gridOffset.current.y - effectiveSpeed + wrapY) % wrapY;
            }
            updateCellOpacities();
            drawGrid();
            requestRef.current = requestAnimationFrame(updateAnimation);
          };

          const handleMouseMove = (event) => {
            const mouseX = event.clientX;
            const mouseY = event.clientY;
            let col;
            let row;
            if (isHex) {
              const colShift = Math.floor(gridOffset.current.x / hexHoriz);
              const offsetX =
                ((gridOffset.current.x % hexHoriz) + hexHoriz) % hexHoriz;
              const offsetY =
                ((gridOffset.current.y % hexVert) + hexVert) % hexVert;
              col = Math.round((mouseX - offsetX) / hexHoriz);
              const rowOffset = (col + colShift) % 2 !== 0 ? hexVert / 2 : 0;
              row = Math.round((mouseY - offsetY - rowOffset) / hexVert);
            } else if (isTri) {
              const halfW = squareSize / 2;
              const offsetX = ((gridOffset.current.x % halfW) + halfW) % halfW;
              const offsetY =
                ((gridOffset.current.y % squareSize) + squareSize) % squareSize;
              col = Math.round((mouseX - offsetX) / halfW);
              row = Math.floor((mouseY - offsetY) / squareSize);
            } else {
              const offsetX =
                ((gridOffset.current.x % squareSize) + squareSize) % squareSize;
              const offsetY =
                ((gridOffset.current.y % squareSize) + squareSize) % squareSize;
              col =
                shape === "circle"
                  ? Math.round((mouseX - offsetX) / squareSize)
                  : Math.floor((mouseX - offsetX) / squareSize);
              row =
                shape === "circle"
                  ? Math.round((mouseY - offsetY) / squareSize)
                  : Math.floor((mouseY - offsetY) / squareSize);
            }
            if (
              !hoveredSquare.current ||
              hoveredSquare.current.x !== col ||
              hoveredSquare.current.y !== row
            ) {
              if (hoveredSquare.current && hoverTrailAmount > 0) {
                trailCells.current.unshift({ ...hoveredSquare.current });
                if (trailCells.current.length > hoverTrailAmount)
                  trailCells.current.length = hoverTrailAmount;
              }
              hoveredSquare.current = { x: col, y: row };
            }
          };

          const handleMouseLeave = () => {
            if (hoveredSquare.current && hoverTrailAmount > 0) {
              trailCells.current.unshift({ ...hoveredSquare.current });
              if (trailCells.current.length > hoverTrailAmount)
                trailCells.current.length = hoverTrailAmount;
            }
            hoveredSquare.current = null;
          };

          window.addEventListener("resize", resizeCanvas);
          window.addEventListener("mousemove", handleMouseMove);
          window.addEventListener("mouseleave", handleMouseLeave);
          resizeCanvas();
          requestRef.current = requestAnimationFrame(updateAnimation);
          return () => {
            window.removeEventListener("resize", resizeCanvas);
            window.removeEventListener("mousemove", handleMouseMove);
            window.removeEventListener("mouseleave", handleMouseLeave);
            cancelAnimationFrame(requestRef.current);
          };
        }, [
          direction,
          speed,
          borderColor,
          hoverFillColor,
          hoverColor,
          squareSize,
          shape,
          hoverTrailAmount,
        ]);

        return (
          <canvas
            ref={canvasRef}
            className={`shapegrid-canvas ${className}`}
          ></canvas>
        );
      }

      function ClickSpark({ children, sparkColor = "#fff" }) {
        const canvasRef = useRef(null);
        const sparksRef = useRef([]);
        const frameRef = useRef(null);
        const sparkDuration = 150;

        useEffect(() => {
          const canvas = canvasRef.current;
          if (!canvas) return;

          const resize = () => {
            const ratio = window.devicePixelRatio || 1;
            canvas.width = Math.max(1, Math.floor(window.innerWidth * ratio));
            canvas.height = Math.max(1, Math.floor(window.innerHeight * ratio));
            canvas.style.width = `${window.innerWidth}px`;
            canvas.style.height = `${window.innerHeight}px`;
            canvas.getContext("2d").setTransform(ratio, 0, 0, ratio, 0, 0);
          };

          resize();
          window.addEventListener("resize", resize);

          return () => {
            if (frameRef.current) cancelAnimationFrame(frameRef.current);
            window.removeEventListener("resize", resize);
          };
        }, []);

        const draw = (time) => {
          const canvas = canvasRef.current;
          if (!canvas) return;

          const ctx = canvas.getContext("2d");
          ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

          sparksRef.current = sparksRef.current.filter((spark) => {
            const elapsed = time - spark.start;
            if (elapsed > sparkDuration) return false;

            const progress = elapsed / sparkDuration;
            const ease = progress * (2 - progress);
            const distance = ease * 14;
            const length = 8 * (1 - ease);

            ctx.globalAlpha = 1 - progress;
            ctx.strokeStyle = sparkColor;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(
              spark.x + distance * Math.cos(spark.angle),
              spark.y + distance * Math.sin(spark.angle),
            );
            ctx.lineTo(
              spark.x + (distance + length) * Math.cos(spark.angle),
              spark.y + (distance + length) * Math.sin(spark.angle),
            );
            ctx.stroke();
            return true;
          });

          ctx.globalAlpha = 1;

          if (sparksRef.current.length) {
            frameRef.current = requestAnimationFrame(draw);
          } else {
            frameRef.current = null;
            ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
          }
        };

        const click = (e) => {
          sparksRef.current.push(
            ...Array.from({ length: 6 }, (_, index) => ({
              x: e.clientX,
              y: e.clientY,
              angle: (Math.PI * 2 * index) / 6,
              start: performance.now(),
            })),
          );
          if (!frameRef.current) frameRef.current = requestAnimationFrame(draw);
        };

        return (
          <div
            onClick={click}
            style={{ position: "relative", minHeight: "100vh" }}
          >
            <canvas
              ref={canvasRef}
              style={{
                position: "fixed",
                inset: 0,
                width: "100%",
                height: "100%",
                pointerEvents: "none",
                zIndex: 9999,
              }}
            />
            {children}
          </div>
        );
      }

      function GridPattern({ id, offset }) {
        return (
          <svg width="100%" height="100%" style={{ display: "block" }}>
            <defs>
              <pattern
                id={id}
                width="40"
                height="40"
                patternUnits="userSpaceOnUse"
                x={offset.x}
                y={offset.y}
              >
                <path
                  d="M 40 0 L 0 0 0 40"
                  fill="none"
                  stroke="currentColor"
                  strokeWidth="1"
                />
              </pattern>
            </defs>
            <rect width="100%" height="100%" fill={`url(#${id})`} />
          </svg>
        );
      }

      function InfiniteGridBackground() {
        const [offset, setOffset] = useState({ x: 0, y: 0 });
        const [mouse, setMouse] = useState(() => ({
          x: window.innerWidth / 2,
          y: window.innerHeight / 3,
        }));

        useEffect(() => {
          let frame;
          const speed = 0.5;
          const animate = () => {
            setOffset((current) => ({
              x: (current.x + speed) % 40,
              y: (current.y + speed) % 40,
            }));
            frame = requestAnimationFrame(animate);
          };
          frame = requestAnimationFrame(animate);
          return () => cancelAnimationFrame(frame);
        }, []);

        useEffect(() => {
          const handleMove = (event) =>
            setMouse({ x: event.clientX, y: event.clientY });
          const handleResize = () =>
            setMouse({ x: window.innerWidth / 2, y: window.innerHeight / 3 });
          window.addEventListener("mousemove", handleMove);
          window.addEventListener("resize", handleResize);
          return () => {
            window.removeEventListener("mousemove", handleMove);
            window.removeEventListener("resize", handleResize);
          };
        }, []);

        const maskImage = `radial-gradient(310px circle at ${mouse.x}px ${mouse.y}px, black, transparent)`;
        return (
          <div className="infinite-grid-bg" aria-hidden="true">
            <div className="infinite-grid-layer base">
              <GridPattern id="role-ready-grid-base" offset={offset} />
            </div>
            <div
              className="infinite-grid-layer active"
              style={{ maskImage, WebkitMaskImage: maskImage }}
            >
              <GridPattern id="role-ready-grid-active" offset={offset} />
            </div>
            <div className="infinite-grid-vignette" />
          </div>
        );
      }

      function App() {
        const [screen, setScreen] = useState("auth");
        const [, setVersion] = useState(0);
        const refresh = () => setVersion((v) => v + 1);
        useEffect(() => {
          if (localStorage.getItem("roleready_theme") === "light") {
            document.body.classList.add("light");
          }
          const token = localStorage.getItem("roleready_token");
          if (!token) return;
          fetch(api("/api/auth/me"), {
            headers: { Authorization: `Bearer ${token}` },
          })
            .then((res) => (res.ok ? res.json() : null))
            .then((data) => {
              if (data?.user) {
                appUser = data.user;
                setScreen("dashboard");
                refresh();
              }
            })
            .catch(() => {});
        }, []);
        const navigate = (next) => setScreen(next);
        const handleAuth = (user) => {
          appUser = user;
          setScreen("dashboard");
          refresh();
        };
        const logout = () => {
          localStorage.removeItem("roleready_token");
          appUser = { name: "User", email: "", provider: "email" };
          setScreen("auth");
          refresh();
        };
        const screens = {
          auth: <AuthScreen onAuth={handleAuth} />,
          dashboard: <DashboardScreen navigate={navigate} refresh={refresh} />,
          analysis: <AnalysisScreen navigate={navigate} />,
          jobs: <JobsScreen navigate={navigate} />,
          interview: <InterviewScreen navigate={navigate} refresh={refresh} />,
          report: <ReportScreen navigate={navigate} />,
        };
        const current =
          screen === "auth"
            ? screens.auth
            : React.cloneElement(screens[screen] || screens.dashboard, {
                onLogout: logout,
              });
        return (
          <ClickSpark>
            <InfiniteGridBackground />
            <div style={{ position: "relative", zIndex: 1 }}>{current}</div>
          </ClickSpark>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
